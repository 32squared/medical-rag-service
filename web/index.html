<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0E8A6B" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>마이헬스케어</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<!-- 런타임 BFF(API) 베이스 주입(정적 호스팅 분리). 모듈 스크립트보다 먼저 실행되도록 클래식 스크립트. -->
<script src="config.js"></script>
<style>
  :root{
    --bg:#F6F4EF; --surface:#FFFFFF; --teal:#0E8A6B; --teal-d:#0B6E52;
    --amber:#E0A23E; --red:#C8553D; --ink:#2B2B2B; --muted:#6B6B6B; --line:#E7E3DA;
    --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(20,40,30,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  #root{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  .pad{padding:20px}
  .grow{flex:1}
  h1{font-size:22px;margin:0 0 6px} h2{font-size:17px;margin:0 0 10px}
  .muted{color:var(--muted);font-size:14px;line-height:1.55}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
  .dot{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#15A982);
    display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow)}
  .btn{appearance:none;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;
    width:100%;cursor:pointer;background:var(--teal);color:#fff;transition:.15s}
  .btn:active{transform:translateY(1px)} .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}
  .btn.warn{background:transparent;color:var(--red);border:1px solid var(--red)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;
    border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .req{font-size:11px;color:var(--teal);font-weight:700;background:rgba(14,138,107,.1);
    padding:2px 7px;border-radius:99px;margin-left:6px}
  .sw{position:relative;width:46px;height:28px;border-radius:99px;background:var(--line);
    transition:.2s;cursor:pointer;flex:none}
  .sw.on{background:var(--teal)} .sw.lock{opacity:.6;cursor:default}
  .sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
    transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .sw.on i{left:21px}
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;
    border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
  .icobtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;
    font-size:13px;cursor:pointer;color:var(--ink)}
  .chat{display:flex;flex-direction:column;gap:10px;padding:16px 20px 0}
  .msg{max-width:84%;padding:11px 14px;border-radius:14px;font-size:15px;line-height:1.5;white-space:pre-wrap}
  .msg.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:5px}
  .msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;
    background:rgba(224,162,62,.15);color:#9A6B16;margin-bottom:4px}
  .citelink{color:var(--teal);font-weight:700;text-decoration:none;font-size:.92em;padding:0 1px}
  .citelink:hover{text-decoration:underline}
  .sources{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .srctitle{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .srcrow{display:block;font-size:12.5px;color:var(--ink);text-decoration:none;padding:4px 0;line-height:1.4}
  .srcrow:hover{color:var(--teal)} .srcrow .ext{color:var(--teal);font-weight:700}
  .iv{background:#FFFDF7;border-color:#EFE3C8}
  .ivintro{font-size:13px;color:var(--muted);margin-bottom:8px;line-height:1.5}
  .ivq{font-size:15px;margin-bottom:10px}
  .ivopts{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:99px;padding:8px 13px;
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .chip:hover{background:rgba(14,138,107,.08)} .chip.ghost{border-color:var(--line);color:var(--muted)}
  .streak{font-size:12.5px;color:var(--teal);font-weight:700}
  .banner{background:#FFF6E6;border:1px solid #F0DDB0;border-radius:10px;padding:9px 11px;font-size:12.5px;color:#8A5A12;margin-bottom:10px;line-height:1.5}
  .ckrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .ckrow:last-child{border-bottom:0}
  .ckbtn{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;flex:none;font-family:inherit}
  .ckbtn.done{background:var(--teal);color:#fff;opacity:.85}
  .trackgrid{display:flex;gap:10px;margin-top:6px}
  .trackcard{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer;box-shadow:var(--shadow);font-family:inherit;color:var(--ink)}
  .trackcard:hover{border-color:var(--teal)}
  .chip.sel{background:var(--teal);color:#fff;border-color:var(--teal)}
  .seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
  .segb{flex:1;border:0;background:#fff;padding:11px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);font-family:inherit}
  .segb.on{background:var(--teal);color:#fff}
  .faccard{margin-top:10px;padding:13px}
  .badge.open{background:rgba(14,138,107,.12);color:var(--teal)}
  .badge.closed{background:rgba(0,0,0,.06);color:var(--muted)}
  .personacard{display:block;width:100%;text-align:left;padding:14px;margin-bottom:10px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .personacard:hover{border-color:var(--teal)} .personacard:disabled{opacity:.6}
  .psbar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 4px;font-size:13px}
  .psbar>span{font-weight:700;color:var(--teal)}
  .pschips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .antic{margin:2px 0 8px;border-left:4px solid var(--amber);background:#FFFBF3}
  .antic.emg{border-left-color:var(--red);background:#FDF1EE}
  .anticbadge{font-size:11px;font-weight:800;color:#9A6B16;margin-bottom:5px;letter-spacing:.02em}
  .antic.emg .anticbadge{color:var(--red)}
  .antictext{font-size:14.5px;line-height:1.55}
  .anticnote{font-size:11.5px;color:var(--muted);margin-top:5px}
  .typing{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
  .dots{display:inline-flex;gap:4px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);
    background:var(--surface);position:sticky;bottom:0}
  .composer input{flex:1;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;
    font-family:inherit;outline:none}
  .stepdots{display:flex;gap:6px;margin-bottom:18px}
  .stepdots b{width:24px;height:5px;border-radius:99px;background:var(--line)}
  .stepdots b.on{background:var(--teal)}
  .note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}
  .err{color:var(--red);font-size:13px;margin-top:8px}
  .center{display:flex;flex-direction:column;justify-content:center;min-height:100vh}
</style>
<script type="importmap">
{
  "imports": {
    "preact": "https://esm.sh/preact@10.19.3",
    "preact/hooks": "https://esm.sh/preact@10.19.3/hooks?external=preact",
    "htm": "https://esm.sh/htm@3.1.1"
  }
}
</script>
</head>
<body>
<div id="root"></div>
<script type="module">
import { h, render, Fragment } from 'preact';
import { useState, useEffect, useRef } from 'preact/hooks';
import htm from 'htm';
const html = htm.bind(h);

// ── BFF 클라이언트 ────────────────────────────────────────────
// 우선순위: 수동 오버라이드(localStorage) > 빌드주입(config.js: window.__MHC_BFF__) > same-origin('').
const BFF = (localStorage.getItem('mhc_bff') || window.__MHC_BFF__ || '').replace(/\/$/, '');
const TK = 'mhc_tokens';
const getTok = () => { try { return JSON.parse(localStorage.getItem(TK) || 'null'); } catch { return null; } };
const setTok = (t) => t ? localStorage.setItem(TK, JSON.stringify(t)) : localStorage.removeItem(TK);

async function refresh() {
  const t = getTok();
  if (!t || !t.refresh_token) return false;
  const r = await fetch(BFF + '/auth/refresh', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: t.session_id, refresh_token: t.refresh_token }),
  });
  if (!r.ok) { setTok(null); return false; }
  const d = await r.json();
  setTok({ ...t, access_token: d.access_token, refresh_token: d.refresh_token });
  return true;
}

async function api(path, { method = 'GET', body, auth = true, retry = true } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  const t = getTok();
  if (auth && t) headers['Authorization'] = 'Bearer ' + t.access_token;
  const res = await fetch(BFF + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401 && auth && retry && await refresh())
    return api(path, { method, body, auth, retry: false });
  return res;
}

// 안정적 데모 본인인증 식별자(같은 기기=같은 계정)
function deviceIdentity() {
  let v = localStorage.getItem('mhc_devid');
  if (!v) { v = 'mhc-' + Math.random().toString(36).slice(2, 11); localStorage.setItem('mhc_devid', v); }
  return v;
}

const ITEM_DESC = {
  personal_info: '서비스 이용을 위한 기본 개인정보',
  sensitive_info: '맞춤 안내를 위한 건강·검진 정보(민감)',
  cross_border: '국외 LLM 이용 시 개인정보 국외이전',
  location: '가까운 병원·약국 찾기(위치)',
  push: '코칭 리마인더 등 알림(정보통신망법)',
  phr_link: '공단 건강검진 연동',
};

// ── 토글 ──────────────────────────────────────────────────────
function Toggle({ on, lock, onClick }) {
  return html`<div class=${'sw' + (on ? ' on' : '') + (lock ? ' lock' : '')}
    onClick=${lock ? null : onClick}><i></i></div>`;
}

// ── 온보딩 ────────────────────────────────────────────────────
function Onboarding({ onDone }) {
  const [step, setStep] = useState(0);
  const [items, setItems] = useState([]);
  const [sel, setSel] = useState({ personal_info: true });
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  useEffect(() => {
    api('/consent/items', { auth: false }).then(r => r.json())
      .then(d => setItems(d.items || [])).catch(() => setErr('서버에 연결할 수 없습니다.'));
  }, []);

  const toggle = (k) => setSel(s => ({ ...s, [k]: !s[k] }));

  async function finish() {
    setBusy(true); setErr('');
    try {
      const s = await (await api('/auth/pass/start', { auth: false, method: 'POST', body: {} })).json();
      const cb = await api('/auth/pass/callback', {
        auth: false, method: 'POST', body: { tx_id: s.tx_id, mock_identity: deviceIdentity() },
      });
      if (!cb.ok) throw new Error('본인인증 실패');
      setTok(await cb.json());
      for (const it of items)
        if (sel[it.item_key])
          await api('/consent', { method: 'POST', body: { item_key: it.item_key, action: 'grant', source: 'onboarding' } });
      onDone();
    } catch (e) { setErr(String(e.message || e)); } finally { setBusy(false); }
  }

  if (step === 0) return html`<div class="pad center">
    <div class="brand" style="font-size:26px"><span class="dot">+</span> 마이헬스케어</div>
    <p class="muted" style="margin-top:14px">의료법을 지키며 믿을 수 있는 건강 정보를 안내하고,
      매일의 건강 습관을 함께 만들어가는 코칭까지. 시작해볼까요?</p>
    <div style="height:24px"></div>
    <button class="btn" onClick=${() => setStep(1)}>시작하기</button>
    <p class="note">테스트용 프로토타입 · 합성 데이터 · 의료자문 아님</p>
  </div>`;

  return html`<div class="pad">
    <div class="stepdots"><b class="on"></b><b class="on"></b></div>
    <h1>이용 동의</h1>
    <p class="muted">필수 항목에 동의하면 시작할 수 있어요. 선택 항목은 언제든 설정에서 바꿀 수 있습니다.</p>
    <div style="height:14px"></div>
    <div class="card">
      ${items.map(it => html`<div class="row" key=${it.item_key}>
        <div style="flex:1">
          <div style="font-weight:600">${it.title}${it.required ? html`<span class="req">필수</span>` : ''}</div>
          <div class="muted" style="font-size:12.5px">${ITEM_DESC[it.item_key] || ''}</div>
        </div>
        <${Toggle} on=${it.required || !!sel[it.item_key]} lock=${it.required} onClick=${() => toggle(it.item_key)} />
      </div>`)}
    </div>
    ${err && html`<div class="err">${err}</div>`}
    <div style="height:16px"></div>
    <button class="btn" disabled=${busy || !items.length} onClick=${finish}>
      ${busy ? '처리 중…' : '동의하고 본인인증(PASS)'}</button>
    <p class="note">본인인증은 데모(mock)입니다. CI/DI 는 해시로만 저장되며 원문은 보관하지 않습니다.</p>
  </div>`;
}

// 답변 본문의 [n] 마커 → 클릭형 출처 링크(citations[n-1].url)
function renderAnswer(text, cites) {
  return String(text || '').split(/(\[\d+\])/g).map((p, i) => {
    const m = p.match(/^\[(\d+)\]$/);
    if (!m) return p;
    const c = cites && cites[+m[1] - 1];
    return (c && c.url)
      ? html`<a key=${i} class="citelink" href=${c.url} target="_blank" rel="noopener" title=${c.source}>${p}</a>`
      : html`<span key=${i} class="citelink">${p}</span>`;
  });
}

// ── 홈(채팅) ──────────────────────────────────────────────────
function Home({ go }) {
  const [msgs, setMsgs] = useState([{ ai: true, text: '안녕하세요, 마이헬스케어입니다. 건강에 대해 궁금한 점을 물어보세요.' }]);
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(false);
  const [iv, setIv] = useState(null);     // 상황 되묻기(문진): {base, questions, idx, answers, intro}
  const [home, setHome] = useState(null); // {cards, suggested, persona, personalization}
  const endRef = useRef(null);
  useEffect(() => { endRef.current && endRef.current.scrollIntoView({ behavior: 'smooth' }); }, [msgs, iv]);
  useEffect(() => { api('/home').then(r => r.ok ? r.json() : null).then(setHome).catch(() => {}); }, []);
  useEffect(() => {   // 재로그인 시 이전 대화 복원(있으면 인사말 대체)
    api('/chat/history').then(r => r.ok ? r.json() : null).then(d => {
      if (d && d.messages && d.messages.length)
        setMsgs(d.messages.map(m => m.role === 'user'
          ? { me: true, text: m.text }
          : { ai: true, text: m.text, citations: m.citations || [], personalize: m.personalize }));
    }).catch(() => {});
  }, []);
  const persona = home && home.persona;
  const card = home && home.cards && home.cards[0];   // 선제 '오늘 챙길 것' 1개
  const suggested = (home && home.suggested) || [];

  async function send(q) {
    q = (q != null ? q : text).trim(); if (!q || busy) return;
    setText(''); setIv(null);
    setMsgs(m => [...m, { me: true, text: q }]); setBusy(true);
    try {
      const r = await api('/chat', { method: 'POST', body: { message: q } });
      if (r.status === 403) { setMsgs(m => [...m, { ai: true, text: '개인정보 이용 동의가 필요합니다. 설정에서 확인해주세요.' }]); return; }
      const d = await r.json();
      const rag = d.rag || {};
      const answer = rag.answer || rag.echo || (rag.error ? ('답변을 불러오지 못했습니다 (' + rag.error + ')') : JSON.stringify(rag));
      setMsgs(m => [...m, { ai: true, text: answer, citations: rag.citations || [], personalize: d.personalization }]);
      const c = d.clarifiers;
      if (c && c.questions && c.questions.length)
        setIv({ base: q, questions: c.questions, idx: 0, answers: [], intro: c.intro });
    } catch { setMsgs(m => [...m, { ai: true, text: '일시적인 오류가 발생했습니다.' }]); }
    finally { setBusy(false); }
  }

  function answerIv(opt) {
    setIv(cur => {
      if (!cur) return null;
      const answers = cur.answers.concat(opt);
      if (cur.idx + 1 < cur.questions.length) return { ...cur, idx: cur.idx + 1, answers };
      setTimeout(() => send(cur.base + ' / 문진: ' + answers.join(', ')), 0);  // 종합 → 정밀 재안내
      return null;
    });
  }

  return html`<${Fragment}>
    <div class="hdr">
      <div class="brand"><span class="dot">+</span> 마이헬스케어</div>
      <div style="display:flex;gap:6px">
        <button class="icobtn" onClick=${() => go('coaching')}>💪 코칭</button>
        <button class="icobtn" onClick=${() => go('finder')}>📍 찾기</button>
        <button class="icobtn" onClick=${() => go('settings')}>내 정보</button>
      </div>
    </div>
    <div class="grow chat">
      ${msgs.map((m, i) => html`<div class=${'msg ' + (m.me ? 'me' : 'ai')} key=${i}>
        ${m.personalize ? html`<div class="badge">맞춤 안내</div>` : ''}
        ${m.me ? m.text : renderAnswer(m.text, m.citations)}
        ${(!m.me && m.citations && m.citations.length) ? html`<div class="sources">
          <div class="srctitle">출처 ${m.citations.length}</div>
          ${m.citations.map(c => html`<a class="srcrow" key=${c.n} href=${c.url || '#'}
              target=${c.url ? '_blank' : undefined} rel="noopener">
            <b>[${c.n}]</b> ${c.source}${c.title ? (' — ' + c.title) : ''}${c.url ? html` <span class="ext">↗</span>` : ''}</a>`)}
        </div>` : ''}
      </div>`)}
      ${msgs.length <= 1 && card ? html`<div class=${'card antic' + (card.kind === 'emergency' ? ' emg' : '')}>
        <div class="anticbadge">${card.kind === 'emergency' ? '🚨 지금 바로' : card.kind === 'must_attend' ? '⚠️ 오늘 챙길 것' : '💡 안내'}</div>
        <div class="antictext">${card.text}</div>
        ${card.note ? html`<div class="anticnote">${card.note}</div>` : ''}
        ${card.referral === 'hospital' ? html`<button class="chip" style="margin-top:10px" onClick=${() => go('finder')}>📍 병원 찾기</button>` : ''}
      </div>` : ''}
      ${persona && msgs.length <= 1 ? html`<div class="psbar">
        <span>${persona.emoji} ${persona.name}${persona.band ? (' · 혈압 ' + persona.band) : ''}</span>
        ${suggested.length ? html`<div class="pschips">${suggested.slice(0, 4).map(q => html`<button class="chip" key=${q} onClick=${() => send(q)}>${q}</button>`)}</div>` : ''}
      </div>` : ''}
      ${iv ? html`<div class="msg ai iv">
        <div class="ivintro">🩺 ${iv.intro || '더 정확히 좁혀 드릴까요? 답해 주시면 위 답변을 상황에 맞게 다시 안내드려요.'}</div>
        <div class="ivq"><b>(${iv.idx + 1}/${iv.questions.length})</b> ${iv.questions[iv.idx].q}</div>
        <div class="ivopts">
          ${iv.questions[iv.idx].options.map(o => html`<button class="chip" key=${o} onClick=${() => answerIv(o)}>${o}</button>`)}
          <button class="chip ghost" onClick=${() => setIv(null)}>괜찮아요</button>
        </div>
      </div>` : ''}
      ${busy ? html`<div class="msg ai typing">
        <span class="dots"><i></i><i></i><i></i></span><span>답변을 준비하고 있어요…</span>
      </div>` : ''}
      <div ref=${endRef}></div>
    </div>
    <div class="composer">
      <input value=${text} placeholder="증상이나 건강 질문을 입력하세요"
        onInput=${e => setText(e.target.value)} onKeyDown=${e => e.key === 'Enter' && send()} />
      <button class="btn" style="width:auto;padding:13px 18px" disabled=${busy} onClick=${() => send()}>전송</button>
    </div>
  </${Fragment}>`;
}

// ── 설정(동의 관리·로그아웃·탈퇴) ─────────────────────────────
function Settings({ go }) {
  const [me, setMe] = useState(null);
  const [busy, setBusy] = useState('');
  const load = () => api('/me').then(r => r.ok ? r.json() : null).then(setMe);
  useEffect(() => { load(); }, []);

  async function toggle(it) {
    if (it.required) return;
    setBusy(it.item_key);
    await api('/consent', { method: 'POST', body: { item_key: it.item_key, action: it.granted ? 'revoke' : 'grant', source: 'settings' } });
    await load(); setBusy('');
  }
  async function logout() { await api('/auth/logout', { method: 'POST' }); setTok(null); go('onboarding'); }
  async function withdraw() {
    if (!confirm('회원 탈퇴하시겠어요? 동의가 모두 해제됩니다.')) return;
    await api('/me', { method: 'DELETE' }); setTok(null); go('onboarding');
  }

  if (!me) return html`<div class="pad center"><p class="muted">불러오는 중…</p></div>`;
  return html`<${Fragment}>
    <div class="hdr">
      <button class="icobtn" onClick=${() => go('home')}>‹ 홈</button>
      <div class="brand" style="font-size:16px">내 정보 · 동의 관리</div><span style="width:48px"></span>
    </div>
    <div class="pad">
      <div class="card">
        ${me.consent.map(it => html`<div class="row" key=${it.item_key}>
          <div style="flex:1"><div style="font-weight:600">${it.title}${it.required ? html`<span class="req">필수</span>` : ''}</div>
            <div class="muted" style="font-size:12.5px">${ITEM_DESC[it.item_key] || ''}</div></div>
          <${Toggle} on=${it.granted} lock=${it.required || busy === it.item_key} onClick=${() => toggle(it)} />
        </div>`)}
      </div>
      <p class="note">동의 철회는 즉시 반영됩니다. 개인화 안내는 민감정보 동의가 있을 때만 제공됩니다.</p>
      <div style="height:18px"></div>
      <button class="btn ghost" onClick=${logout}>로그아웃</button>
      <div style="height:10px"></div>
      <button class="btn warn" onClick=${withdraw}>회원 탈퇴</button>
    </div>
  </${Fragment}>`;
}

const TRACK_LABEL = { diet: '🥗 식단', exercise: '🏃 운동', habit: '🌙 습관' };

// ── 코칭(개인별 영속) ─────────────────────────────────────────
function Coaching({ go }) {
  const [state, setState] = useState(null);   // {plan, stats}
  const [cfg, setCfg] = useState(null);
  const [track, setTrack] = useState(null);
  const [intake, setIntake] = useState({});
  const [busy, setBusy] = useState(false);
  const load = () => api('/coaching').then(r => r.json()).then(setState);
  useEffect(() => { load(); api('/coaching/config').then(r => r.json()).then(setCfg).catch(() => {}); }, []);

  async function makePlan() {
    setBusy(true);
    try { await api('/coaching/plan', { method: 'POST', body: { track, intake } }); } catch {}
    setTrack(null); setIntake({}); await load(); setBusy(false);
  }
  async function checkin(it) {
    await api('/coaching/checkin', { method: 'POST', body: { plan_id: state.plan.plan_id, item_key: it.key, done: true } });
    await load();
  }

  const trackPicker = () => track
    ? (() => {
        const t = cfg && cfg.tracks.find(x => x.key === track);
        const qs = (t && t.intake) || [];
        const ready = qs.every(q => intake[q.id]);
        return html`<div class="card" key="tp-intake">
          <div style="font-weight:700;margin-bottom:10px">${TRACK_LABEL[track]} 시작 — 몇 가지만 알려주세요</div>
          ${qs.map(q => html`<div key=${q.id} style="margin-bottom:12px">
            <div style="font-size:14px;margin-bottom:6px">${q.q}</div>
            <div class="ivopts">${q.options.map(o => html`<button class=${'chip' + (intake[q.id] === o ? ' sel' : '')}
              key=${o} onClick=${() => setIntake(s => ({ ...s, [q.id]: o }))}>${o}</button>`)}</div>
          </div>`)}
          <button class="btn" disabled=${!ready || busy} onClick=${makePlan}>${busy ? '생성 중…' : '플랜 만들기'}</button>
          <div style="height:8px"></div>
          <button class="btn ghost" onClick=${() => { setTrack(null); setIntake({}); }}>취소</button>
        </div>`;
      })()
    : html`<div class="trackgrid" key="tp-grid">
        ${['diet', 'exercise', 'habit'].map(t => html`<button class="trackcard" key=${t} onClick=${() => setTrack(t)}>
          <div style="font-size:26px">${TRACK_LABEL[t].split(' ')[0]}</div>
          <div style="font-weight:700;margin-top:4px">${TRACK_LABEL[t].split(' ')[1]}</div></button>`)}
      </div>`;

  return html`<${Fragment}>
    <div class="hdr"><button class="icobtn" onClick=${() => go('home')}>‹ 홈</button>
      <div class="brand" style="font-size:16px">건강 코칭</div><span style="width:48px"></span></div>
    <div class="pad grow" style="overflow:auto">
      ${!state ? html`<p class="muted">불러오는 중…</p>`
        : state.plan ? html`<${Fragment} key="cg-plan">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <div style="font-weight:700">${TRACK_LABEL[state.plan.track] || state.plan.track} · ${state.plan.period || ''}</div>
              <div class="streak">🔥 ${state.stats.streak}일 · ✓ ${state.stats.done}</div>
            </div>
            ${state.plan.banner ? html`<div class="banner">${state.plan.banner}</div>` : ''}
            ${state.plan.items.map(it => html`<div class="ckrow" key=${it.key}>
              <div style="flex:1"><div>${it.text}</div><div class="muted" style="font-size:11.5px">근거 · ${it.cite || ''}</div></div>
              <button class=${'ckbtn' + (it.done_today ? ' done' : '')} disabled=${it.done_today} onClick=${() => checkin(it)}>
                ${it.done_today ? '완료 ✓' : '오늘 실천'}</button>
            </div>`)}
          </div>
          <p class="note">매일 실천을 체크하면 기록이 쌓이고 다시 로그인해도 이어집니다. 새 트랙은 아래에서 선택하세요.</p>
          ${trackPicker()}
        </${Fragment}>`
        : html`<${Fragment} key="cg-empty">
          <h2>어떤 습관부터 시작할까요?</h2>
          <p class="muted">트랙을 고르면 공신력 있는 생활수칙으로 실천 플랜을 만들어 드려요.</p>
          <div style="height:12px"></div>
          ${trackPicker()}
        </${Fragment}>`}
    </div>
  </${Fragment}>`;
}

// ── 병원·약국 찾기(실데이터/위치기반) ─────────────────────────
function Finder({ go }) {
  const [kind, setKind] = useState('pharmacy');
  const [res, setRes] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  function search() {
    setErr(''); setBusy(true); setRes(null);
    if (!navigator.geolocation) { setErr('이 기기에서 위치를 쓸 수 없어요.'); setBusy(false); return; }
    navigator.geolocation.getCurrentPosition(async pos => {
      try {
        const r = await api('/facilities', { method: 'POST', body: { lat: pos.coords.latitude, lon: pos.coords.longitude, kind } });
        setRes(await r.json());
      } catch { setErr('검색에 실패했어요.'); } finally { setBusy(false); }
    }, () => { setErr('위치 권한이 필요해요.'); setBusy(false); }, { timeout: 10000, enableHighAccuracy: false });
  }

  return html`<${Fragment}>
    <div class="hdr"><button class="icobtn" onClick=${() => go('home')}>‹ 홈</button>
      <div class="brand" style="font-size:16px">병원·약국 찾기</div><span style="width:48px"></span></div>
    <div class="pad grow" style="overflow:auto">
      <div class="seg">
        <button class=${'segb' + (kind === 'pharmacy' ? ' on' : '')} onClick=${() => setKind('pharmacy')}>약국</button>
        <button class=${'segb' + (kind === 'hospital' ? ' on' : '')} onClick=${() => setKind('hospital')}>병원</button>
      </div>
      <button class="btn" disabled=${busy} onClick=${search}>${busy ? '내 위치로 찾는 중…' : '📍 내 위치로 찾기'}</button>
      ${err && html`<div class="err">${err}</div>`}
      <p class="note">위치는 검색에만 쓰이고 저장하지 않아요 · 거리순 중립 안내(특정 업체 추천 아님).</p>
      ${res ? html`<div>
        <div class="muted" style="font-size:12px;margin-bottom:6px">${res.real ? '실데이터' : '데모'} · ${res.notice || ''}</div>
        ${(res.items || []).length ? res.items.map((f, i) => html`<div class="card faccard" key=${i}>
          <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
            <div style="font-weight:700">${f.name}</div>
            ${f.open_now === true ? html`<span class="badge open">영업중</span>` : f.open_now === false ? html`<span class="badge closed">영업종료</span>` : ''}
          </div>
          <div class="muted" style="font-size:12.5px">${f.dist_label || ''}${f.hours ? (' · ' + f.hours) : ''}${f.addr ? (' · ' + f.addr) : (f.area ? (' · ' + f.area) : '')}${f.dept ? (' · ' + f.dept) : ''}</div>
          <div style="display:flex;gap:8px;margin-top:8px">
            ${f.map_url ? html`<a class="btn ghost" style="padding:8px 12px;width:auto" href=${f.map_url} target="_blank" rel="noopener">지도</a>` : ''}
            ${f.tel_url ? html`<a class="btn ghost" style="padding:8px 12px;width:auto" href=${f.tel_url}>전화</a>` : ''}
          </div>
        </div>`) : html`<p class="muted">주변에서 찾지 못했어요.</p>`}
      </div>` : ''}
    </div>
  </${Fragment}>`;
}

// ── 체험 프로필(페르소나) 선택 ────────────────────────────────
function Persona({ go }) {
  const [list, setList] = useState(null);
  const [busy, setBusy] = useState('');
  useEffect(() => { api('/personas', { auth: false }).then(r => r.json()).then(d => setList(d.personas || [])); }, []);
  async function pick(p) {
    setBusy(p.id);
    try { await api('/persona/select', { method: 'POST', body: { persona_id: p.id } }); go('home'); }
    catch { setBusy(''); }
  }
  return html`<${Fragment}>
    <div class="hdr"><span style="width:48px"></span>
      <div class="brand" style="font-size:16px">체험 프로필 선택</div><span style="width:48px"></span></div>
    <div class="pad grow" style="overflow:auto">
      <p class="muted">데모 체험을 위해 가상의 건강 프로필을 하나 골라주세요. 선택한 프로필의 신호로
        <b>맞춤 안내와 코칭</b>을 경험할 수 있어요. (합성 데이터 · 실제 본인 정보 아님)</p>
      <div style="height:12px"></div>
      ${!list ? html`<p class="muted">불러오는 중…</p>` : list.map(p => html`
        <button class="card personacard" key=${p.id} disabled=${!!busy} onClick=${() => pick(p)}>
          <div style="display:flex;gap:12px;align-items:center">
            <div style="font-size:30px">${p.emoji}</div>
            <div style="flex:1;text-align:left">
              <div style="font-weight:700">${p.name}</div>
              <div class="muted" style="font-size:12.5px">${p.profile}</div>
            </div>
            <span class="muted">${busy === p.id ? '…' : '›'}</span>
          </div>
        </button>`)}
    </div>
  </${Fragment}>`;
}

// ── 앱 루트 ───────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('loading');
  useEffect(() => {
    if (!getTok()) { setScreen('onboarding'); return; }
    api('/persona').then(async r => {
      if (r.status === 401) { setTok(null); setScreen('onboarding'); return; }
      const d = await r.json();
      setScreen(d.persona ? 'home' : 'persona');     // 페르소나 미선택 → 선택 화면
    }).catch(() => setScreen('onboarding'));
  }, []);
  if (screen === 'loading') return html`<div class="pad center"><p class="muted">불러오는 중…</p></div>`;
  if (screen === 'onboarding') return html`<${Onboarding} onDone=${() => setScreen('persona')} />`;
  if (screen === 'persona') return html`<${Persona} go=${setScreen} />`;
  if (screen === 'settings') return html`<${Settings} go=${setScreen} />`;
  if (screen === 'coaching') return html`<${Coaching} go=${setScreen} />`;
  if (screen === 'finder') return html`<${Finder} go=${setScreen} />`;
  return html`<${Home} go=${setScreen} />`;
}

render(html`<${App} />`, document.getElementById('root'));
if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
