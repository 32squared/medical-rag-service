<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0E8A6B" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>마이헬스케어</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- 오늘의 나 재미 레이어 서체(design.md §2): Lexend 숫자·영문, Jua 한글 헤드라인, Quicksand/Gowun Dodum 본문 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@600;700;800&family=Jua&family=Quicksand:wght@600;700&family=Gowun+Dodum&display=swap" />
<!-- 런타임 BFF(API) 베이스 주입(정적 호스팅 분리). 모듈보다 먼저 실행되도록 클래식 스크립트. -->
<script src="config.js"></script>
<style>
  :root{
    --bg:#F6F4EF; --surface:#FFFFFF; --teal:#0E8A6B; --teal-d:#0B6E52; --teal-l:#E7F3EF;
    --amber:#E0A23E; --red:#C8553D; --ink:#2B2B2B; --muted:#6B6B6B; --line:#E7E3DA;
    --radius:16px; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(20,40,30,.06);
    --tabh:62px;

    /* ── 오늘의 나 재미 레이어 토큰 (docs/design/todays-me-mockups/design.md §5) — 기존 토큰과 이름 분리 ── */
    --c-lemon:#FFD84D; --c-lavender:#CDBFF7; --c-pink:#F5A8D8; --c-mint:#BFE8CF;
    --c-peach:#FFC98F; --c-sky:#AFC9F5; --c-olive:#A9B86B; --c-cream:#FFF3D6;
    --c-cream-2:#FFF8EC; --c-sage:#E4EBC7;
    --c-ink:#141414; --c-ink-soft:#3A3A3A; --c-muted:#6B6B6B; --c-muted-2:#7A7A7A;
    --c-white:#FFFFFF; --c-toggle-off:#DDE6DF;
    --c-water:#4C86F0; --c-bolt:#FFB800; --c-bolt-accent:#FF8A5B; --c-moon:#8E7BEF;
    --c-skin:#FFD9B8; --c-blush:#F5A7D6;
    --c-theme-coral:#E2593A; --c-theme-lavender:#7C6BD9; --c-theme-forest:#4E7A5A; --c-card-text:#FFF3E0;
    --font-display-latin:'Lexend','Malgun Gothic',system-ui,sans-serif;
    --font-display-ko:'Jua','Malgun Gothic',system-ui,sans-serif;
    --font-body:'Quicksand','Gowun Dodum','Malgun Gothic',system-ui,sans-serif;
    --safe-top:56px; --page-x:22px; --stack-gap:16px; --row-gap:10px; --nav-h:64px; --cta-bottom:22px;
    --r-xl:32px; --r-lg:28px; --r-md:24px; --r-sm:12px; --r-pill:999px;
    --border-bold:3px; --border-check:2px;
    --shadow-card:0 18px 40px rgba(20,20,20,.16);
    --shadow-stage:0 14px 30px rgba(20,20,20,.12);
    --ease:cubic-bezier(.2,.8,.2,1); --dur-wake:400ms; --dur-ring:900ms; --dur-reveal-max:2500ms;
    --tap-min:44px; --cta-h:60px; --btn-h:48px; --chip-h:36px; --tile-h:122px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  #root{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
  button{font-family:inherit}
  .pad{padding:20px}
  .center{display:flex;flex-direction:column;justify-content:center;min-height:70dvh}
  .muted{color:var(--muted);font-size:14px;line-height:1.55}
  .note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.55}
  .err{color:var(--red);font-size:13px;margin-top:10px}
  h1{font-size:22px;margin:0 0 6px}
  .sectitle{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.02em;margin-bottom:8px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
  .dot{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#15A982);
    display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800}

  /* 레이아웃 — 탭바 고정, 본문 스크롤 */
  .screen{flex:1;display:flex;flex-direction:column;min-height:0;padding-bottom:var(--tabh)}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 0}
  .bottompad{height:28px}

  /* 헤더 */
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:13px 16px;border-bottom:1px solid var(--line);background:var(--surface);
    position:sticky;top:0;z-index:5}
  .hdrtitle{font-weight:700;font-size:16px;flex:1;text-align:center}
  .hdrspacer,.hdrright{min-width:52px;display:flex;justify-content:flex-end}
  .hdrspacer{justify-content:flex-start}
  .icobtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;
    padding:7px 10px;font-size:13px;cursor:pointer;color:var(--ink)}

  /* 버튼 */
  .btn{appearance:none;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;
    width:100%;cursor:pointer;background:var(--teal);color:#fff;transition:.15s;display:block;text-align:center;
    text-decoration:none}
  .btn:active{transform:translateY(1px)} .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}
  .btn.warn{background:transparent;color:var(--red);border:1px solid var(--red)}
  .btn.small{padding:8px 12px;width:auto;font-size:13px;display:inline-block}
  .linkbtn{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 2px;
    text-decoration:underline;text-underline-offset:2px}
  .dotsep{color:var(--line);margin:0 6px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;
    border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .req{font-size:11px;color:var(--teal);font-weight:700;background:rgba(14,138,107,.1);
    padding:2px 7px;border-radius:99px;margin-left:6px}
  .sw{position:relative;width:46px;height:28px;border-radius:99px;background:var(--line);
    transition:.2s;cursor:pointer;flex:none}
  .sw.on{background:var(--teal)} .sw.lock{opacity:.6;cursor:default}
  .sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
    transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .sw.on i{left:21px}
  .stepdots{display:flex;gap:6px;margin-bottom:18px}
  .stepdots b{width:24px;height:5px;border-radius:99px;background:var(--line)}
  .stepdots b.on{background:var(--teal)}

  /* 상태 뷰 */
  .spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);
    border-top-color:var(--teal);animation:spin .8s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .errbox,.emptybox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 18px;text-align:center;box-shadow:var(--shadow)}
  .errtitle,.emptytitle{font-weight:700;font-size:15.5px}
  .infobox{background:#EEF4FB;border:1px solid #CBDCEC;color:#2A5C8A;border-radius:12px;
    padding:12px 13px;font-size:13px;line-height:1.6;margin-top:10px}
  .banner{background:#FFF6E6;border:1px solid #F0DDB0;border-radius:12px;padding:10px 12px;
    font-size:12.5px;color:#8A5A12;line-height:1.55;margin-bottom:12px}
  .safetybox{background:#FDF1EE;border:1px solid #E8C4BB;border-radius:var(--radius);padding:18px}
  .safetytitle{font-weight:800;color:#A23B26;font-size:16px;line-height:1.5}

  /* ── 오늘 탭: 히어로 ── */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;
    box-shadow:var(--shadow);border-left:5px solid var(--teal)}
  .hero-done{border-left-color:#9BC7B7;background:var(--teal-l)}
  .herotop{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .herotag{font-size:11.5px;font-weight:800;color:var(--teal);letter-spacing:.03em}
  .heromin{font-size:11.5px;color:var(--muted);background:var(--bg);padding:3px 8px;border-radius:99px}
  .herotext{font-size:17px;line-height:1.55;font-weight:600}
  .herocite{font-size:11.5px;color:var(--muted);margin-top:8px}
  .herobtn{margin-top:14px}
  .heroopts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .optbtn{flex:1;min-width:88px;border:1.5px solid var(--teal);background:#fff;color:var(--teal);
    border-radius:12px;padding:13px 10px;font-size:14.5px;font-weight:700;cursor:pointer}
  .optbtn:active{background:var(--teal);color:#fff} .optbtn:disabled{opacity:.5}
  .heroDoneRow{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:14px;color:var(--teal-d);font-weight:600}
  .okmark{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
  .herosub{display:flex;align-items:center;justify-content:center;margin-top:12px}
  .toast{background:var(--teal);color:#fff;border-radius:12px;padding:11px 14px;font-size:14px;
    font-weight:600;text-align:center;margin-top:10px;animation:pop .25s ease-out}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}

  .evidence{margin-top:12px;font-size:12.5px;color:var(--muted);background:var(--surface);
    border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
  .evlabel{font-weight:700;color:var(--teal)}
  .bandchip{display:inline-block;font-size:12px;font-weight:700;color:var(--teal);
    background:var(--teal-l);padding:5px 11px;border-radius:99px;margin-bottom:12px}
  .streakchip{font-size:13px;font-weight:800;color:var(--teal)}

  .themecard{margin-top:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px}
  .themetitle{font-weight:700;font-size:14.5px}
  .thememission{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
  .themeprog{display:flex;align-items:center;gap:10px;margin-top:12px}
  .pbar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .pfill{height:100%;background:var(--teal);border-radius:99px;transition:width .35s}
  .pnum{font-size:12.5px;font-weight:700;color:var(--teal);flex:none}

  .weekdots{display:flex;justify-content:space-between;gap:4px;margin-top:12px;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
  .wd{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
  .wdlabel{font-size:11px;color:var(--muted)}
  .wddot{width:11px;height:11px;border-radius:50%;background:var(--line)}
  .wd-done .wddot{background:var(--teal)}
  .wd-skip .wddot{background:var(--amber)}
  .wd-na .wddot{background:#C9C9C9}
  .wd-missed .wddot{background:#EDE9E0}
  .wd-today .wddot{background:#fff;border:2.5px solid var(--teal)}
  .wd-future .wddot{background:#F1EEE7}

  .supportwrap{margin-top:16px}
  .suprow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:12px;margin-bottom:8px}
  .supmain{flex:1;font-size:14px}
  .supcite{font-size:11px;color:var(--muted);margin-top:3px}
  .supstate{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);flex:none;
    display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
  .supstate.on{background:var(--teal);border-color:var(--teal)}

  .coach{margin-top:14px;background:var(--teal-l);border-radius:12px;padding:12px 14px;
    font-size:13.5px;color:var(--teal-d);line-height:1.6}
  .previewcard{margin-top:14px;background:var(--surface);border:1px dashed var(--line);
    border-radius:14px;padding:14px}
  .previewlabel{font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:6px}
  .previewtext{font-size:14px;line-height:1.55}
  .reportcue{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--surface);border:1px solid var(--teal);border-radius:12px;padding:12px 14px;
    font-size:13.5px;font-weight:600;color:var(--teal-d);cursor:pointer;margin-bottom:12px}

  /* 12주 스트립 */
  .strip{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:13px;margin-top:16px;cursor:pointer;text-align:left}
  .striprow{display:flex;gap:3px}
  .wseg{flex:1;height:9px;border-radius:3px;background:#EDE9E0}
  .wseg-done{background:var(--teal)}
  .wseg-past{background:#BFD9D0}
  .wseg-now{background:var(--amber);box-shadow:0 0 0 2px rgba(224,162,62,.25)}
  .stripfoot{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--muted)}
  .stripmore{color:var(--teal);font-weight:700}

  .askwrap{margin-top:18px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--teal);background:#fff;color:var(--teal);border-radius:99px;
    padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;text-align:left}
  .chip.sel{background:var(--teal);color:#fff}
  .chip.ghost{border-color:var(--line);color:var(--muted)}
  .chip:disabled{opacity:.5}

  /* ── 프로그램 탭 ── */
  .pgsummary{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px;margin-bottom:12px}
  .pgring{width:84px;height:84px;border-radius:50%;border:6px solid var(--teal-l);
    display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;
    border-top-color:var(--teal);border-right-color:var(--teal)}
  .pgweek{font-size:26px;font-weight:800;color:var(--teal);line-height:1}
  .pgweek span{font-size:12px;margin-left:1px}
  .pgtotal{font-size:11px;color:var(--muted);margin-top:2px}
  .pgstats{flex:1;display:flex;justify-content:space-between;text-align:center}
  .pgstats div{display:flex;flex-direction:column;gap:3px}
  .pgstats b{font-size:15px} .pgstats span{font-size:11px;color:var(--muted)}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .badge2{font-size:12px;background:var(--surface);border:1px solid var(--line);
    border-radius:99px;padding:6px 11px}

  .timeline{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:6px 14px;margin-bottom:14px}
  .tlrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .tlrow:last-child{border-bottom:0}
  .tlweek{width:32px;text-align:center;flex:none;color:var(--muted)}
  .tlweek b{display:block;font-size:15px;color:var(--ink)}
  .tlweek span{font-size:10px}
  .tlbody{flex:1;min-width:0}
  .tlphase{font-size:10.5px;color:var(--teal);font-weight:800}
  .tltheme{font-size:13.5px;margin-top:2px;line-height:1.4}
  .tlstat{font-size:12px;color:var(--muted);flex:none}
  .tl-done .tlweek b{color:var(--teal)}
  .tl-future{opacity:.5}
  .tl-now{background:var(--teal-l);margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:10px}

  .heatwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .heat{display:flex;flex-wrap:wrap;gap:3px}
  .hcell{width:12px;height:12px;border-radius:3px;background:#EDE9E0;display:inline-block}
  .hcell.h1{background:#BFD9D0} .hcell.h2{background:var(--teal)}
  .heatlegend{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:11px;color:var(--muted)}

  .rpcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:12px}
  .rpbig{font-size:32px;font-weight:800;color:var(--teal);line-height:1}
  .rpbig span{font-size:15px;color:var(--muted);font-weight:600}
  .rptheme{font-size:13.5px;margin-top:6px}
  .rprow{display:flex;gap:14px;margin-top:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .rprow b{color:var(--ink)}
  .rpdelta{margin-top:10px;font-size:12.5px;color:var(--teal);font-weight:700}
  .barwrap{display:flex;align-items:flex-end;gap:6px;height:92px;margin-top:4px}
  .barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%}
  .bartrack{flex:1;width:100%;background:#EDE9E0;border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
  .barfill{width:100%;background:var(--teal);border-radius:5px;min-height:3px}
  .barlab{font-size:10px;color:var(--muted)}
  .trendlab{margin-top:10px;font-size:12.5px;color:var(--muted)}
  .rpcard.next{border-color:var(--teal);background:var(--teal-l)}
  .nexttheme{font-size:14.5px;font-weight:700;color:var(--teal-d)}

  /* ── 상담 탭 ── */
  .chatwrap{flex:1;display:flex;flex-direction:column;min-height:0}
  .chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px 18px 4px}
  .msg{max-width:86%;padding:11px 14px;border-radius:14px;font-size:15px;line-height:1.55;white-space:pre-wrap}
  .msg.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:5px}
  .msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;
    background:rgba(224,162,62,.15);color:#9A6B16;margin-bottom:4px}
  .badge.open{background:rgba(14,138,107,.12);color:var(--teal)}
  .badge.closed{background:rgba(0,0,0,.06);color:var(--muted)}
  .citelink{color:var(--teal);font-weight:700;text-decoration:none;font-size:.92em}
  .sources{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .srctitle{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .srcrow{display:block;font-size:12.5px;color:var(--ink);text-decoration:none;padding:4px 0;line-height:1.4}
  .iv{background:#FFFDF7;border-color:#EFE3C8}
  .ivintro{font-size:13px;color:var(--muted);margin-bottom:8px;line-height:1.5}
  .ivq{font-size:15px;margin-bottom:10px}
  .typing{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
  .dots{display:inline-flex;gap:4px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:blink 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .composer{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface)}
  .composer input{flex:1;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;
    font-family:inherit;outline:none;min-width:0}
  .sendbtn{width:auto;padding:13px 18px}

  /* ── 내 건강 탭 ── */
  .dgcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .dgtop{display:flex;align-items:center;justify-content:space-between}
  .dgband{font-size:17px;font-weight:800;color:var(--teal)}
  .dgoff{font-size:11px;color:var(--muted);background:var(--bg);padding:3px 8px;border-radius:99px}

  /* ═══════════ 오늘의 나 재미 레이어 (design.md · 하이브리드 D1: 홈 상단·기록·리빌만 캔디 시스템) ═══════════ */

  .fl-cupgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

  .fl-stepper{display:flex;align-items:center;gap:10px}
  .fl-stepbtn{width:56px;height:56px;border-radius:50%;border:0;background:#fff;font-size:26px;cursor:pointer;color:var(--c-ink)}
  .fl-stepinput{flex:1;min-width:0;height:56px;border:0;border-radius:var(--r-pill);background:#fff;text-align:center;font-family:var(--font-display-latin);font-size:28px;font-weight:800;color:var(--c-ink)}
  .fl-timerwrap{position:relative;width:120px;height:120px;margin:0 auto}
  .fl-timernum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800}

  /* 화면 2 — 기록 */
  .fl-ringcard{border-radius:var(--r-xl);background:var(--c-cream-2);padding:18px 20px;display:flex;align-items:center;gap:14px;margin-top:6px}
  .fl-ringwrap{position:relative;width:176px;height:176px;flex:none}
  .fl-arc{transition:stroke var(--dur-ring) var(--ease)}
  .fl-ringel{position:absolute;line-height:0} .fl-ringel-w{left:138px;top:42px} .fl-ringel-b{left:81px;top:148px} .fl-ringel-m{left:22px;top:44px}
  .fl-ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .fl-ringnum{font-size:50px;font-weight:800;line-height:1} .fl-ringcap{font-size:12px;color:var(--c-muted)}
  .fl-ringtitle{font-size:20px;line-height:1.2} .fl-ringsub{font-size:12px;color:var(--c-muted);line-height:1.5;margin-top:8px}
  .fl-mcard{border-radius:var(--r-lg);padding:18px 20px;margin-top:12px;position:relative;overflow:hidden;color:var(--c-ink)}
  .fl-mcard-water{background:var(--c-sky)} .fl-mcard-steps{background:var(--c-lemon)} .fl-mcard-mind{background:var(--c-pink)}
  .fl-mrow{display:flex;gap:12px} .fl-mrow .fl-mcard{flex:1;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;padding:18px}
  .fl-mtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .fl-mnum{display:flex;align-items:baseline;gap:6px} .fl-mnum .lex{font-size:40px;font-weight:800;line-height:1} .fl-mnum .jua{font-size:18px}
  .fl-conv{height:26px;padding:0 10px;border-radius:var(--r-pill);background:#fff;font-size:12px;display:inline-flex;align-items:center;white-space:nowrap}
  .fl-cups{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .fl-mchar{position:absolute;right:6px;top:8px;line-height:0}
  .fl-mlabel{font-size:15px} .fl-mbig{font-size:32px;font-weight:800;line-height:1;display:flex;align-items:baseline;gap:4px} .fl-munit{font-size:15px;font-weight:400}
  .fl-mcap{font-size:12px;color:rgba(20,20,20,.62);margin-top:4px}
  .fl-dash{color:var(--c-muted-2)}
  .fl-highlight{min-height:56px;border-radius:var(--r-pill);background:#fff;padding:8px 16px 8px 8px;display:flex;align-items:center;gap:10px;font-size:13.5px;margin-top:12px}
  .fl-hlstar{width:40px;height:40px;border-radius:50%;background:var(--c-lemon);display:inline-flex;align-items:center;justify-content:center;flex:none}

  /* 화면 3 — 리빌 */
  .fl-reveal{padding:8px var(--page-x) 0;overflow-y:auto;position:relative}
  .fl-revealhead{display:flex;align-items:center;justify-content:space-between;padding-top:6px}
  .fl-stagewrap{position:relative;height:330px;margin-top:14px}
  .fl-stagecard{position:absolute;border-radius:var(--r-xl);transition:opacity .4s var(--ease),transform .5s var(--ease)}
  .fl-stagecard-back{left:42px;top:20px;width:262px;height:300px;background:var(--c-cream);transform:rotate(6deg)}
  .fl-stagecard-mid{left:30px;top:8px;width:286px;height:306px;background:var(--c-lemon);transform:rotate(-4deg)}
  .fl-stagechar{position:absolute;left:0;right:0;top:40px;display:flex;justify-content:center;transition:opacity .35s var(--ease),transform .5s var(--ease)}
  .fl-gather{position:absolute;inset:0;pointer-events:none}
  .fl-gatherdot{position:absolute;top:150px;width:16px;height:16px;border-radius:50%;opacity:0;transition:all .8s var(--ease)}
  .fl-gd-water{background:var(--c-water);left:20%} .fl-gd-bolt{background:var(--c-bolt);left:78%} .fl-gd-moon{background:var(--c-moon);left:50%;top:40px}
  .fl-stagehint{position:absolute;left:0;right:0;bottom:-4px;text-align:center;font-size:12px;color:rgba(20,20,20,.6)}
  .fl-stage-dim .fl-stagecard,.fl-stage-dim .fl-stagechar,.fl-stage-gather .fl-stagechar{opacity:0}

  .fl-revealname{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em} .fl-revealko{font-size:22px} .fl-reveallore{font-size:14px;color:rgba(20,20,20,.7)}
  .fl-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .fl-tag{height:36px;padding:0 14px;border-radius:var(--r-pill);background:#fff;font-size:13px;display:inline-flex;align-items:center;gap:6px}
  .fl-tagdot{width:8px;height:8px;border-radius:50%;display:inline-block} .fl-tagdot-water{background:var(--c-water)} .fl-tagdot-bolt{background:var(--c-bolt-accent)} .fl-tagdot-moon{background:var(--c-moon)}
  .fl-rarity{font-size:13px;color:rgba(20,20,20,.7);margin-top:6px}
  .fl-coll{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}

  .fl-revealactions{padding:14px 0 28px}
  @media (prefers-reduced-motion:reduce){.fl-stagecard,.fl-stagechar,.fl-gatherdot,.fl-revealbody,.fl-tilechar,.fl-arc{transition:opacity .12s linear}}
</style>
</head>
<body>
<div id="root">
  <!-- 정적 로딩 셸: 모듈 로드 실패와 렌더 실패를 구분하기 위한 최소 표시 -->
  <div class="pad center" id="bootshell">
    <div class="spinner"></div>
    <p class="muted" style="margin-top:10px;text-align:center">불러오는 중…</p>
  </div>
</div>
<noscript><div class="pad">이 앱은 자바스크립트가 필요합니다.</div></noscript>

<script type="importmap">
{
  "imports": {
    "preact": "https://esm.sh/preact@10.19.3",
    "preact/hooks": "https://esm.sh/preact@10.19.3/hooks?external=preact",
    "htm": "https://esm.sh/htm@3.1.1"
  }
}
</script>
<script type="module" src="js/app.js"></script>
<script>
  // 모듈 로드 자체가 실패하면(네트워크·CSP·구형 브라우저) 로딩 셸이 영원히 남는다.
  // 8초 뒤에도 부팅 셸이 그대로면 안내로 교체한다.
  setTimeout(function () {
    var s = document.getElementById('bootshell');
    if (s && s.parentNode) {
      s.innerHTML = '<div class="errbox"><div class="errtitle">앱을 불러오지 못했습니다.</div>'
        + '<div class="muted" style="font-size:12.5px;margin-top:6px">네트워크 상태를 확인한 뒤 새로고침 해주세요.</div>'
        + '</div>';
    }
  }, 8000);
</script>
</body>
</html>
