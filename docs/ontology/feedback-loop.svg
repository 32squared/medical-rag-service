<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>
  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7a8794"/></marker>
    <marker id="ml" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#1f4e79"/></marker>
  </defs>
  <style>
    text{fill:#1f2933}.s{fill:#5a6b7b}.box{fill:#fff;stroke:#c2cedb}.a{fill:#dce9f6;stroke:#1f4e79}
    .b{fill:#eaf1e6;stroke:#7aa06a}.c{fill:#f3e8f1;stroke:#9b6a93}.warn{fill:#f7e2d2;stroke:#b5651d}
    .e{stroke:#7a8794;fill:none}.lp{stroke:#1f4e79;fill:none;stroke-width:1.6}.el{fill:#1f4e79;font-style:italic}
    .zh{fill:#1f4e79;font-weight:700}
  </style>
  <text x="22" y="30" font-size="19" font-weight="700">대화 → 피드백 추출 → 성능 개선 (폐루프)</text>

  <!-- 대화 -->
  <rect x="400" y="48" width="180" height="42" rx="8" class="box"/>
  <text x="490" y="68" font-size="14" text-anchor="middle" font-weight="700">대화 (사용자 × 주치의)</text>
  <text x="490" y="84" font-size="10" text-anchor="middle" class="s">메모리화: Turn·Intent·맥락</text>

  <!-- 3 레인 -->
  <g text-anchor="middle">
    <rect x="40" y="140" width="280" height="78" rx="8" class="a"/>
    <text x="180" y="162" font-size="13" font-weight="700">A. 행동 분석</text>
    <text x="180" y="180" font-size="11" class="s">비식별 이벤트 → PostHog</text>
    <text x="180" y="196" font-size="10.5" class="s">퍼널·리텐션·A/B·기능플래그</text>
    <text x="180" y="210" font-size="9.5" class="s">(self-hosted · 비식별만)</text>

    <rect x="350" y="140" width="280" height="78" rx="8" class="b"/>
    <text x="490" y="162" font-size="13" font-weight="700">B. 피드백 추출 (우리 LLM)</text>
    <text x="490" y="180" font-size="11" class="s">만족·거절수요·정정·재질문·👍/👎</text>
    <text x="490" y="196" font-size="10.5" class="s">→ 검수 큐(사람 확인, E5)</text>
    <text x="490" y="210" font-size="9.5" class="s">Feedback 온톨로지로 구조화</text>

    <rect x="660" y="140" width="280" height="78" rx="8" class="c"/>
    <text x="800" y="162" font-size="13" font-weight="700">C. LLM 품질·관측</text>
    <text x="800" y="180" font-size="11" class="s">ANANTA (내부·국내)</text>
    <text x="800" y="196" font-size="10.5" class="s">골든셋·judge·인용·지연·안전판정</text>
    <text x="800" y="210" font-size="9.5" class="s">(외부 Arize 대체)</text>
  </g>
  <line x1="450" y1="90" x2="200" y2="138" class="e" marker-end="url(#m)"/>
  <line x1="490" y1="90" x2="490" y2="138" class="e" marker-end="url(#m)"/>
  <line x1="530" y1="90" x2="780" y2="138" class="e" marker-end="url(#m)"/>

  <!-- 개선 백로그 -->
  <rect x="320" y="262" width="340" height="56" rx="8" class="box"/>
  <text x="490" y="284" font-size="13.5" text-anchor="middle" font-weight="700">개선 백로그 (ImprovementItem)</text>
  <text x="490" y="302" font-size="10.5" text-anchor="middle" class="s">프롬프트 개선 · KB 확장(거절수요) · 검색 랭킹 · 도달/표현 갭</text>
  <line x1="180" y1="218" x2="400" y2="260" class="e" marker-end="url(#m)"/>
  <line x1="490" y1="218" x2="490" y2="260" class="e" marker-end="url(#m)"/>
  <line x1="800" y1="218" x2="580" y2="260" class="e" marker-end="url(#m)"/>

  <!-- 골든셋 게이트 → 배포 -->
  <rect x="300" y="350" width="220" height="48" rx="8" class="warn"/>
  <text x="410" y="372" font-size="13" text-anchor="middle" font-weight="700">골든셋 게이트</text>
  <text x="410" y="388" font-size="10" text-anchor="middle" class="s">안전 회귀 0 통과 시만(E3)</text>
  <rect x="560" y="350" width="160" height="48" rx="8" class="a"/>
  <text x="640" y="378" font-size="13" text-anchor="middle" font-weight="700">배포</text>
  <line x1="490" y1="318" x2="430" y2="348" class="e" marker-end="url(#m)"/>
  <line x1="520" y1="374" x2="558" y2="374" class="e" marker-end="url(#m)"/>

  <!-- 폐루프 (배포 → 대화) -->
  <path d="M720 374 C 900 360, 900 70, 582 70" class="lp" marker-end="url(#ml)"/>
  <text x="870" y="220" class="el" font-size="11" text-anchor="middle">개선 반영</text>

  <!-- 안전 공리 -->
  <rect x="40" y="430" width="900" height="150" rx="8" fill="#f6f8fb" stroke="#d4dde7"/>
  <text x="54" y="452" class="zh" font-size="12">데이터 모델에 박힌 개선 루프 공리 (E)</text>
  <g font-size="11">
    <text x="54" y="474">• E1 피드백은 민감(건강 텍스트) → 동의·마스킹·국내저장</text>
    <text x="54" y="494">• E2 PostHog엔 비식별 이벤트만(라벨·카운트·불리언). 질의텍스트·원시수치·진단명·PII 금지 · self-hosted(국외이전 0)</text>
    <text x="54" y="514">• E3 개선 항목은 골든셋 게이트 통과 시에만 배포(안전 회귀 0)</text>
    <text x="54" y="534">• E4 거절수요 = ‘원했으나 합법적으로 못 준’ = KB확장·표현개선 1급 입력</text>
    <text x="54" y="554">• E5 자동 추출 피드백은 사람 검수 경유(자동 프롬프트/규칙 변경 금지) · E6 응급 재평가·안전 불변식 항상 유지 · E7 A/B는 안전 동등성 전제</text>
  </g>
  <g font-size="10">
    <rect x="700" y="442" width="13" height="11" rx="2" class="a"/><text x="718" y="451" class="s">PostHog</text>
    <rect x="780" y="442" width="13" height="11" rx="2" class="b"/><text x="798" y="451" class="s">우리 추출</text>
    <rect x="868" y="442" width="13" height="11" rx="2" class="c"/><text x="886" y="451" class="s">ANANTA</text>
  </g>
</svg>
