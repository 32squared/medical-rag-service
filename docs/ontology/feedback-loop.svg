<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>
  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7a8794"/></marker>
    <marker id="ml" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#1f4e79"/></marker>
  </defs>
  <style>
    text{fill:#1f2933}.s{fill:#5a6b7b}.box{fill:#fff;stroke:#c2cedb}.hub{fill:#dce9f6;stroke:#1f4e79;stroke-width:2}
    .b{fill:#eaf1e6;stroke:#7aa06a}.c{fill:#f3e8f1;stroke:#9b6a93}.a{fill:#fdf3e3;stroke:#c89a4a}
    .warn{fill:#f7e2d2;stroke:#b5651d}.e{stroke:#7a8794;fill:none}.lp{stroke:#1f4e79;fill:none;stroke-width:1.6}
    .el{fill:#1f4e79;font-style:italic}.zh{fill:#1f4e79;font-weight:700}
  </style>
  <text x="22" y="28" font-size="19" font-weight="700">대화 → 이벤트 스토어 중심 개선 루프</text>

  <rect x="410" y="46" width="170" height="38" rx="8" class="box"/>
  <text x="495" y="70" font-size="13.5" text-anchor="middle" font-weight="700">대화 (사용자 × 주치의)</text>
  <line x1="495" y1="84" x2="495" y2="114" class="e" marker-end="url(#m)"/>

  <rect x="350" y="116" width="290" height="66" rx="10" class="hub"/>
  <text x="495" y="140" font-size="14.5" text-anchor="middle" font-weight="700">이벤트 스토어 (Postgres)</text>
  <text x="495" y="158" font-size="10" text-anchor="middle" class="s">rag_queries 감사 확장 — 단일 이벤트 허브</text>
  <text x="495" y="172" font-size="9.5" text-anchor="middle" class="s">비식별 신호: intent·referral·재질문·지연·피드백·판정</text>

  <rect x="30" y="124" width="300" height="58" rx="8" class="b"/>
  <text x="180" y="144" font-size="12.5" text-anchor="middle" font-weight="700">B. 피드백 추출 (LLM)</text>
  <text x="180" y="161" font-size="10" text-anchor="middle" class="s">만족·거절수요·정정·재질문·👍/👎</text>
  <text x="180" y="175" font-size="9.5" text-anchor="middle" class="s">→ 검수 큐(사람, E5) → 스토어 기록</text>
  <line x1="330" y1="150" x2="348" y2="150" class="e" marker-end="url(#m)"/>

  <rect x="660" y="124" width="290" height="58" rx="8" class="c"/>
  <text x="805" y="144" font-size="12.5" text-anchor="middle" font-weight="700">C. 품질·평가</text>
  <text x="805" y="161" font-size="10" text-anchor="middle" class="s">골든셋·judge·인용·지연·안전판정</text>
  <text x="805" y="175" font-size="9.5" text-anchor="middle" class="s">→ 판정 기록 (내부·국내)</text>
  <line x1="660" y1="150" x2="642" y2="150" class="e" marker-end="url(#m)"/>

  <rect x="30" y="214" width="300" height="56" rx="8" class="a"/>
  <text x="180" y="234" font-size="12.5" text-anchor="middle" font-weight="700">A. 분석 — BI 대시보드</text>
  <text x="180" y="251" font-size="10" text-anchor="middle" class="s">Metabase / Grafana (스토어 위)</text>
  <text x="180" y="265" font-size="9.5" text-anchor="middle" class="s">퍼널·리텐션·코호트 — SQL 조회</text>
  <path d="M360 182 C 300 200, 250 205, 230 212" class="e" marker-end="url(#m)"/>
  <text x="298" y="205" class="el" font-size="9">조회(read)</text>

  <rect x="640" y="214" width="310" height="56" rx="8" class="box"/>
  <text x="795" y="234" font-size="12.5" text-anchor="middle" font-weight="700">개선 백로그 (ImprovementItem)</text>
  <text x="795" y="251" font-size="9.5" text-anchor="middle" class="s">프롬프트 개선 · KB 확장(거절수요)</text>
  <text x="795" y="265" font-size="9.5" text-anchor="middle" class="s">검색 랭킹 · 도달/표현 갭</text>
  <path d="M630 182 C 700 198, 760 205, 790 212" class="e" marker-end="url(#m)"/>
  <text x="712" y="200" class="el" font-size="9">신호 집계</text>

  <rect x="560" y="300" width="200" height="44" rx="8" class="warn"/>
  <text x="660" y="320" font-size="12.5" text-anchor="middle" font-weight="700">골든셋 게이트</text>
  <text x="660" y="336" font-size="9.5" text-anchor="middle" class="s">안전 회귀 0 통과 시만(E3)</text>
  <rect x="790" y="300" width="140" height="44" rx="8" class="hub"/>
  <text x="860" y="326" font-size="12.5" text-anchor="middle" font-weight="700">배포</text>
  <line x1="795" y1="270" x2="700" y2="298" class="e" marker-end="url(#m)"/>
  <line x1="760" y1="322" x2="788" y2="322" class="e" marker-end="url(#m)"/>

  <path d="M860 300 C 900 200, 760 70, 582 66" class="lp" marker-end="url(#ml)"/>
  <text x="912" y="190" class="el" font-size="11" text-anchor="middle">개선 반영</text>

  <rect x="30" y="360" width="920" height="222" rx="8" fill="#f6f8fb" stroke="#d4dde7"/>
  <text x="44" y="382" class="zh" font-size="12">데이터 모델에 박힌 개선 루프 공리 (E)</text>
  <g font-size="10.6">
    <text x="44" y="403">• E1 피드백은 민감(건강 텍스트) → 동의·마스킹·국내저장</text>
    <text x="44" y="423">• E2 이벤트는 이벤트 스토어(국내)에 비식별 신호(라벨·카운트·불리언)로만 기록. 질의텍스트·원시수치·진단명·PII 금지</text>
    <text x="44" y="443">• E3 개선 항목은 골든셋 게이트 통과 시에만 배포(안전 회귀 0)</text>
    <text x="44" y="463">• E4 거절수요 = ‘원했으나 합법적으로 못 준’ = KB확장·표현개선 1급 입력</text>
    <text x="44" y="483">• E5 자동 추출 피드백은 사람 검수 경유 · E6 응급 재평가·안전 불변식 항상 유지 · E7 A/B는 안전 동등성 전제</text>
    <text x="44" y="508" font-weight="700" class="zh" font-size="11">도구는 선택 — 데이터는 이벤트 스토어에 둔다</text>
    <text x="44" y="528">• 지금: rag_queries 감사 확장(이벤트 허브) + Metabase/Grafana 대시보드 + 골든셋·judge(품질). 외부 시스템 0.</text>
    <text x="44" y="548">• A/B: 프롬프트 버전 플래그 + 골든셋·품질평가로 측정.</text>
    <text x="44" y="568">• 나중에(성장팀·세션리플레이·대량 실험): PostHog self-hosted·비식별을 ‘선택적’ 추가. 지금은 불필요.</text>
  </g>
</svg>
