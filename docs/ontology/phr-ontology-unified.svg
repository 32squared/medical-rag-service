<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>
  <defs><marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7a8794"/></marker></defs>
  <style>
    text{fill:#1f2933}.s{fill:#5a6b7b}.box{fill:#fff;stroke:#c2cedb}.src{fill:#eef2f6;stroke:#9fb3c8}
    .mid{fill:#eaf1e6;stroke:#7aa06a}.acc{fill:#dce9f6;stroke:#1f4e79}.warn{fill:#f7e2d2;stroke:#b5651d}
    .zone{fill:#f6f8fb;stroke:#d4dde7}.e{stroke:#7a8794;fill:none}.zh{fill:#1f4e79;font-weight:700}
  </style>
  <text x="22" y="30" font-size="19" font-weight="700">통합 데이터 온톨로지 — 여러 소스 → 하나의 안전 코어</text>

  <!-- 입력 소스 (좌) -->
  <text x="30" y="56" class="zh" font-size="12">① 입력 소스</text>
  <g font-size="10.5">
    <rect x="22" y="62" width="250" height="70" rx="7" class="src"/>
    <text x="32" y="80" font-size="12" font-weight="700">PHR (공단·심평원)</text>
    <text x="32" y="98" class="s">건강검진 · 질병/가족력 · 생활습관</text>
    <text x="32" y="114" class="s">암검진 · 처방 · 진료</text>

    <rect x="22" y="140" width="250" height="64" rx="7" class="src"/>
    <text x="32" y="158" font-size="12" font-weight="700">디바이스(신체)</text>
    <text x="32" y="176" class="s">혈압기 · 체중계 · 통합측정기(A1)</text>
    <text x="32" y="192" class="s">스마트워치(웰니스)</text>

    <rect x="22" y="212" width="250" height="46" rx="7" class="src"/>
    <text x="32" y="230" font-size="12" font-weight="700">환경</text>
    <text x="32" y="248" class="s">공기질 센서 · 공기청정기(운영)</text>

    <rect x="22" y="266" width="250" height="46" rx="7" class="src"/>
    <text x="32" y="284" font-size="12" font-weight="700">OCR (입력 양식)</text>
    <text x="32" y="302" class="s">처방전 · 검사지 · 진단서 · 약봉투</text>

    <rect x="22" y="320" width="250" height="52" rx="7" class="src"/>
    <text x="32" y="338" font-size="12" font-weight="700">LLM 대화</text>
    <text x="32" y="356" class="s">증상·환자맥락 · 의도 · 진술수치</text>
  </g>

  <!-- 정규화 (중) -->
  <text x="320" y="56" class="zh" font-size="12">② 정규화 (signalKey)</text>
  <g font-size="11" text-anchor="middle">
    <rect x="318" y="98" width="210" height="44" rx="6" class="mid"/><text x="423" y="116">관찰값·장치측정값</text><text x="423" y="132" class="s" font-size="9.5">Observation / DeviceMeasurement</text>
    <rect x="318" y="212" width="210" height="40" rx="6" class="mid"/><text x="423" y="236">환경 측정 EnvironmentReading</text>
    <rect x="318" y="266" width="210" height="40" rx="6" class="mid"/><text x="423" y="284">확인 게이트</text><text x="423" y="298" class="s" font-size="9.5">→ PHR 합류(user_confirmed)</text>
    <rect x="318" y="320" width="210" height="52" rx="6" class="mid"/><text x="423" y="340">수집 맥락 DerivedContext</text><text x="423" y="356" class="s" font-size="9.5">진술수치=밴드 미활성(I4)</text>
  </g>
  <!-- 소스→정규화 -->
  <line x1="272" y1="97" x2="316" y2="116" class="e" marker-end="url(#a2)"/>
  <line x1="272" y1="172" x2="316" y2="124" class="e" marker-end="url(#a2)"/>
  <line x1="272" y1="235" x2="316" y2="232" class="e" marker-end="url(#a2)"/>
  <line x1="272" y1="289" x2="316" y2="286" class="e" marker-end="url(#a2)"/>
  <line x1="272" y1="346" x2="316" y2="346" class="e" marker-end="url(#a2)"/>
  <path d="M423 306 C 423 312, 423 314, 423 318" class="e" marker-end="url(#a2)"/>

  <!-- 해석·안전 코어 (우) -->
  <rect x="558" y="62" width="404" height="310" rx="9" class="zone" stroke-dasharray="4 3"/>
  <text x="572" y="82" class="zh" font-size="12">③ 해석 · 안전 코어 (공유)</text>
  <g text-anchor="middle" font-size="11.5">
    <rect x="572" y="92" width="180" height="40" rx="6" class="box"/><text x="662" y="116">참조범위 ReferenceRange</text>
    <rect x="772" y="92" width="176" height="40" rx="6" class="acc"/><text x="860" y="109">밴드라벨</text><text x="860" y="124" class="s" font-size="9.5">안정/주의/경고</text>
    <rect x="572" y="146" width="180" height="38" rx="6" class="acc"/><text x="662" y="169">추세 Trend</text>
    <rect x="772" y="146" width="176" height="38" rx="6" class="acc"/><text x="860" y="162">웰니스 라벨</text><text x="860" y="176" class="s" font-size="9.5">본인 기저선 대비</text>
    <rect x="572" y="198" width="180" height="38" rx="6" class="warn"/><text x="662" y="215">민감도 게이트</text><text x="662" y="229" class="s" font-size="9.5">민감=비표시</text>
    <rect x="772" y="198" width="176" height="38" rx="6" class="warn"/><text x="860" y="215">deny</text><text x="860" y="229" class="s" font-size="9.5">eGFR·워치SpO2·ECG…</text>
    <rect x="572" y="250" width="376" height="38" rx="6" class="box"/><text x="760" y="267">교차신호 화이트리스트 (출처 필수·미등재 금지)</text><text x="760" y="281" class="s" font-size="9.5">RHR+수면 · RHR+호흡 · 혈압+BMI …</text>
  </g>
  <line x1="752" y1="112" x2="770" y2="112" class="e" marker-end="url(#a2)"/>
  <line x1="528" y1="120" x2="570" y2="112" class="e" marker-end="url(#a2)"/>
  <text x="548" y="108" class="s" font-size="9" font-style="italic">interpretedAs</text>
  <text x="572" y="312" class="s" font-size="10">모든 소스가 signalKey로 같은 참조범위를 조인 — 해석·안전은 한 곳에서.</text>

  <!-- 공리 -->
  <rect x="22" y="392" width="940" height="200" rx="9" class="zone"/>
  <text x="34" y="412" class="zh" font-size="12">데이터 모델에 박힌 안전 공리 (소스별)</text>
  <g font-size="10.8">
    <text x="34" y="434" font-weight="700" class="s">A · PHR</text>
    <text x="120" y="434">진단명 비노출 · 민감(정신·암·감염) 표면화0 · deny(eGFR·골밀도·요단백·LDL) · 원시값 외부 미전송</text>
    <text x="34" y="458" font-weight="700" class="s">B · 장치/환경</text>
    <text x="120" y="458">웰니스=기저선만(임상밴드 금지) · ECG·워치SpO2·합성점수 deny · 교차=화이트리스트만 · 환경=환기권유 천장</text>
    <text x="34" y="482" font-weight="700" class="s">C · OCR</text>
    <text x="120" y="482">확인 전 활용 차단 · 진단서→질병이력 자동생성 금지 · 단위 실패=차단 · 확인 후 디바이스급 승격</text>
    <text x="34" y="506" font-weight="700" class="s">D · 대화</text>
    <text x="120" y="506">진술수치=밴드 미활성(증상 맥락만) · 매 턴 응급 재평가 · 맥락은 shaping(진단 아님) · 자유텍스트 동의·마스킹</text>
    <text x="34" y="534" font-weight="700" class="s">공통</text>
    <text x="120" y="534">신뢰위계: 의료근접 &gt; 소비자 &gt; 웰니스 &gt; OCR(확인후) &gt; 사용자 진술. 출처충돌→재측정 권유.</text>
  </g>
  <g font-size="10">
    <rect x="34" y="556" width="13" height="11" rx="2" class="src"/><text x="53" y="565" class="s">입력 소스</text>
    <rect x="150" y="556" width="13" height="11" rx="2" class="mid"/><text x="169" y="565" class="s">정규화</text>
    <rect x="250" y="556" width="13" height="11" rx="2" class="acc"/><text x="269" y="565" class="s">해석값</text>
    <rect x="350" y="556" width="13" height="11" rx="2" class="warn"/><text x="369" y="565" class="s">민감·차단</text>
  </g>
</svg>
