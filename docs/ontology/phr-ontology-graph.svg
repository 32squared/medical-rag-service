<svg viewBox="0 0 940 600" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, sans-serif">
  <rect x="0" y="0" width="940" height="600" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7a8794"/></marker>
    <marker id="aro" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="none" stroke="#999"/></marker>
  </defs>
  <style>
    text{fill:#1f2933}.s{fill:#5a6b7b}.box{fill:#fff;stroke:#c2cedb;rx:6}.cat{fill:#eef2f6;stroke:#c2cedb}
    .acc{fill:#dce9f6;stroke:#1f4e79}.warn{fill:#f7e2d2;stroke:#b5651d}.zone{fill:#f6f8fb;stroke:#d4dde7}
    .e{stroke:#7a8794;fill:none}.el{fill:#1f4e79;font-style:italic}.zh{fill:#1f4e79;font-weight:700}
  </style>
  <text x="22" y="30" font-size="19" font-weight="700">PHR 온톨로지 — 클래스 · 관계 그래프</text>

  <!-- 주체 -->
  <rect x="22" y="52" width="110" height="34" rx="6" class="box"/><text x="77" y="74" font-size="13" text-anchor="middle">사람</text>
  <line x1="132" y1="69" x2="176" y2="69" class="e" marker-end="url(#ar)"/><text x="154" y="63" class="el" font-size="9.5" text-anchor="middle">hasPHR</text>
  <rect x="180" y="52" width="150" height="34" rx="6" class="box"/><text x="255" y="74" font-size="13" text-anchor="middle">PHR 개인건강기록</text>
  <line x1="255" y1="86" x2="255" y2="108" class="e" marker-end="url(#ar)"/>

  <!-- 기록 카테고리 -->
  <rect x="22" y="110" width="466" height="118" rx="8" class="zone"/>
  <text x="34" y="128" class="zh" font-size="11.5">기록 카테고리 (HealthRecord ⊃ 8)</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="34" y="136" width="105" height="30" rx="5" class="cat"/><text x="86" y="155">건강검진</text>
    <rect x="148" y="136" width="105" height="30" rx="5" class="cat"/><text x="200" y="155">질병이력</text>
    <rect x="262" y="136" width="105" height="30" rx="5" class="cat"/><text x="314" y="155">가족력</text>
    <rect x="376" y="136" width="100" height="30" rx="5" class="cat"/><text x="426" y="155">생활습관</text>
    <rect x="34" y="172" width="105" height="30" rx="5" class="cat"/><text x="86" y="191">암검진</text>
    <rect x="148" y="172" width="105" height="30" rx="5" class="cat"/><text x="200" y="191">건강리포트</text>
    <rect x="262" y="172" width="105" height="30" rx="5" class="cat"/><text x="314" y="191">처방</text>
    <rect x="376" y="172" width="100" height="30" rx="5" class="cat"/><text x="426" y="191">진료</text>
  </g>

  <!-- 관찰값 -->
  <line x1="86" y1="166" x2="86" y2="250" class="e" marker-end="url(#ar)"/>
  <text x="150" y="246" class="el" font-size="9.5">건강검진 –hasObservation→</text>
  <rect x="22" y="252" width="466" height="120" rx="8" class="zone"/>
  <text x="34" y="270" class="zh" font-size="11.5">관찰값 (Observation ⊃ 8) — 검진 측정값</text>
  <g font-size="11" text-anchor="middle">
    <rect x="34" y="278" width="105" height="28" rx="5" class="box"/><text x="86" y="296">계측</text>
    <rect x="148" y="278" width="105" height="28" rx="5" class="box"/><text x="200" y="296">활력(혈압)</text>
    <rect x="262" y="278" width="105" height="28" rx="5" class="box"/><text x="314" y="296">혈액검사</text>
    <rect x="376" y="278" width="100" height="28" rx="5" class="box"/><text x="426" y="296">간기능</text>
    <rect x="34" y="312" width="105" height="28" rx="5" class="box"/><text x="86" y="330">요검사</text>
    <rect x="148" y="312" width="105" height="28" rx="5" class="box"/><text x="200" y="330">영상</text>
    <rect x="262" y="312" width="105" height="28" rx="5" class="box"/><text x="314" y="330">골밀도</text>
    <rect x="376" y="312" width="100" height="28" rx="5" class="box"/><text x="426" y="330">종합판정</text>
  </g>
  <text x="34" y="360" class="s" font-size="10">예: 혈액검사 ⊃ 혈색소·혈당·콜레스테롤·중성지방·크레아티닌·eGFR …</text>

  <!-- 해석·안전 레이어 (우측) -->
  <rect x="506" y="110" width="412" height="262" rx="8" class="zone" stroke-dasharray="4 3"/>
  <text x="520" y="128" class="zh" font-size="11.5">④ 해석 · 안전 (우리 엔진)</text>
  <g text-anchor="middle" font-size="12">
    <rect x="525" y="140" width="160" height="34" rx="6" class="box"/><text x="605" y="161">참조범위 ReferenceRange</text>
    <rect x="730" y="140" width="170" height="34" rx="6" class="acc"/><text x="815" y="156">밴드라벨</text><text x="815" y="170" class="s" font-size="9.5">안정 / 주의 / 경고</text>
    <rect x="525" y="190" width="160" height="34" rx="6" class="acc"/><text x="605" y="211">추세 Trend</text>
    <rect x="730" y="190" width="170" height="34" rx="6" class="warn"/><text x="815" y="206">민감도 게이트</text><text x="815" y="220" class="s" font-size="9.5">일반=표시·민감=비표시</text>
    <rect x="525" y="240" width="160" height="34" rx="6" class="box"/><text x="605" y="261">질환 Condition</text>
    <rect x="730" y="240" width="170" height="34" rx="6" class="box"/><text x="815" y="261">약물계열 DrugClass</text>
  </g>
  <!-- 관찰값 → 참조범위/추세/밴드 -->
  <path d="M488 300 C 505 240, 505 180, 523 157" class="e" marker-end="url(#ar)"/><text x="498" y="200" class="el" font-size="9">comparedTo</text>
  <path d="M488 320 C 505 280, 505 220, 523 207" class="e" marker-end="url(#ar)"/><text x="500" y="250" class="el" font-size="9">partOfTrend</text>
  <line x1="685" y1="157" x2="728" y2="157" class="e" marker-end="url(#ar)"/><text x="707" y="151" class="el" font-size="8.5">definesBand</text>
  <line x1="685" y1="257" x2="728" y2="257" class="e" marker-end="url(#ar)"/><text x="707" y="251" class="el" font-size="8.5">hasSensitivity</text>
  <text x="700" y="135" class="el" font-size="9">관찰값 –interpretedAs→ 밴드라벨</text>

  <!-- 하단 규칙 -->
  <rect x="22" y="392" width="896" height="78" rx="8" class="zone"/>
  <text x="34" y="412" class="zh" font-size="11.5">데이터 모델에 박힌 안전 공리</text>
  <text x="34" y="432" font-size="11">• deny(밴드 금지): eGFR · 골밀도 · 요단백 · LDL → “수치는 의료진과”</text>
  <text x="34" y="450" font-size="11">• 민감(표면화 0): 우울증 · 정신질환 · C형간염 · 결핵 · 암</text>
  <text x="470" y="432" font-size="11">• 시간산술: 암검진 갭 · 처방 리필 · 진료 경과</text>
  <text x="470" y="450" font-size="11">• 원시값·질환명은 외부(LLM/국외) 미전송</text>

  <!-- 범례 -->
  <g font-size="10">
    <rect x="34" y="486" width="13" height="11" rx="2" class="cat"/><text x="53" y="495" class="s">구조·개념</text>
    <rect x="150" y="486" width="13" height="11" rx="2" class="acc"/><text x="169" y="495" class="s">해석값</text>
    <rect x="250" y="486" width="13" height="11" rx="2" class="warn"/><text x="269" y="495" class="s">민감·차단</text>
    <line x1="360" y1="491" x2="392" y2="491" class="e" marker-end="url(#aro)"/><text x="398" y="495" class="s">상위→하위(is-a)</text>
    <line x1="520" y1="491" x2="552" y2="491" stroke="#1f4e79" marker-end="url(#ar)"/><text x="558" y="495" class="s">관계(object property)</text>
  </g>
</svg>
