<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/dist/tabler-icons.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
  .ti{font-family:'tabler-icons'!important;font-style:normal}
  html,body{width:390px;height:844px}
  body{font-family:'Pretendard',sans-serif;background:#0A0F0D;color:#F1F5F3;
    position:relative;overflow:hidden;display:flex;flex-direction:column}
  .amb{position:absolute;inset:0;background:
    radial-gradient(420px 360px at 50% 32%, rgba(43,212,166,.18), rgba(43,212,166,0) 70%),
    radial-gradient(300px 300px at 80% 18%, rgba(56,189,248,.10), rgba(56,189,248,0) 70%);}
  .top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;
    padding:18px 26px 0;height:64px}
  .top .d{font-size:13px;color:rgba(241,245,243,.45);letter-spacing:-.2px}
  .top .av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;
    color:rgba(241,245,243,.6);font-size:17px}

  .stage{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center}
  .orbwrap{position:relative;width:300px;height:300px;margin-top:26px;display:flex;
    align-items:center;justify-content:center}
  .ring{position:absolute;border-radius:50%;border:1px solid rgba(43,212,166,.12)}
  .r1{width:300px;height:300px}
  .r2{width:236px;height:236px;border-color:rgba(43,212,166,.18)}
  .glow{position:absolute;width:300px;height:300px;border-radius:50%;filter:blur(46px);
    background:radial-gradient(circle, rgba(43,212,166,.55), rgba(43,212,166,0) 65%)}
  .orb{position:relative;width:176px;height:176px;border-radius:50%;
    background:
      radial-gradient(circle at 38% 32%, #7CF0D8 0%, #34E0AE 26%, #18B892 52%, #0C7C63 78%, #075745 100%);
    box-shadow:0 0 70px rgba(43,212,166,.5), inset -14px -18px 40px rgba(4,40,32,.55),
      inset 10px 12px 30px rgba(180,255,238,.35)}
  .orb .sheen{position:absolute;top:20px;left:30px;width:62px;height:42px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.5), rgba(255,255,255,0) 70%);filter:blur(4px)}

  .state{text-align:center;margin-top:30px}
  .state .b{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;
    letter-spacing:1px;color:#38E0AE;text-transform:uppercase}
  .state .b .pls{width:7px;height:7px;border-radius:50%;background:#38E0AE;box-shadow:0 0 10px #38E0AE}
  .state .t{font-size:24px;font-weight:600;letter-spacing:-.5px;margin-top:11px}
  .state .s{font-size:13.5px;color:rgba(241,245,243,.5);margin-top:6px;letter-spacing:-.2px}

  .gen{margin:0 26px;margin-top:26px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:16px 18px;position:relative;z-index:2}
  .gen .tag{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:1.2px;
    color:#38E0AE;text-transform:uppercase;margin-bottom:9px}
  .gen .row{display:flex;align-items:center;gap:13px}
  .gen .ic{width:42px;height:42px;border-radius:13px;background:rgba(43,212,166,.13);color:#38E0AE;
    display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
  .gen .h{font-size:15.5px;font-weight:600;letter-spacing:-.2px}
  .gen .sub{font-size:12.5px;color:rgba(241,245,243,.5);margin-top:2px}
  .gen .chk{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(43,212,166,.5);flex:none}

  .dock{position:relative;z-index:3;margin:0 22px 26px;margin-top:18px;display:flex;align-items:center;
    gap:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:24px;
    padding:14px 14px 14px 19px;box-shadow:0 10px 50px rgba(43,212,166,.18)}
  .dock .sp{font-size:21px;color:#38E0AE}
  .dock .ph{flex:1;font-size:15px;color:rgba(241,245,243,.55);letter-spacing:-.2px}
  .dock .mic{width:42px;height:42px;border-radius:50%;background:#2BD4A6;color:#06241C;
    display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
</style></head>
<body>
  <div class="amb"></div>

  <div class="top">
    <span class="d">수요일 저녁 · 9:41</span>
    <div class="av"><i class="ti ti-user"></i></div>
  </div>

  <div class="stage">
    <div class="orbwrap">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="glow"></div>
      <div class="orb"><div class="sheen"></div></div>
    </div>
    <div class="state">
      <div class="b"><span class="pls"></span>지금, 안정적이에요</div>
      <div class="t">잔잔히 흐르고 있어요</div>
      <div class="s">혈압·수면이 안정 구간 · 5일째 실천 중</div>
    </div>
  </div>

  <div class="gen">
    <div class="tag"><i class="ti ti-sparkles" style="font-size:13px"></i>AI가 지금 띄웠어요</div>
    <div class="row">
      <div class="ic"><i class="ti ti-salad"></i></div>
      <div style="flex:1">
        <div class="h">오늘은 이것 하나 — 국물 반 남기기</div>
        <div class="sub">저염 흐름을 며칠 더 이어가 볼까요?</div>
      </div>
      <div class="chk"></div>
    </div>
  </div>

  <div class="dock">
    <i class="ti ti-sparkles sp"></i>
    <span class="ph">무엇이든 말하거나 물어보세요</span>
    <span class="mic"><i class="ti ti-microphone"></i></span>
  </div>
</body></html>
