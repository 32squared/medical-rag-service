.rgG .g-pink rect{fill:#FBEAF0;stroke:#993556}.rgG .g-pink .tl{fill:#72243E}.rgG .g-pink .sb{fill:#993556}
.rgG .g-gray rect{fill:#F1EFE8;stroke:#5F5E5A}.rgG .g-gray .tl{fill:#444441}.rgG .g-gray .sb{fill:#5F5E5A}

.rgG .g-teal rect{fill:#085041;stroke:#5DCAA5}.rgG .g-teal .tl{fill:#9FE1CB}.rgG .g-teal .sb{fill:#5DCAA5}

.rgG .nd{cursor:pointer;transition:opacity .15s}
.rgG .eg{transition:opacity .15s}
.rgG .dim{opacity:.14}
.rgL{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}

function showPanel(n){
  panel.innerHTML='<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
    +'<span style="font-size:11px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-secondary)">'+GROUPS[n.g]+'</span>'
    +'<span style="font-size:14px;font-weight:500;color:var(--text-primary)">'+n.l+'</span></div>'
    +'<p style="margin:0 0 6px;font-size:13px;line-height:1.65;color:var(--text-secondary)">'+n.d+'</p>'
    +'<p style="margin:0;font-size:12px;color:var(--text-muted)"><span style="font-family:var(--font-mono)">'+n.f+'</span></p>';
}
svg.addEventListener("click",function(ev){
  var g=ev.target.closest(".nd");
  if(g){
    groupSel=null;
    document.querySelectorAll("#rgLegend button").forEach(function(b){b.classList.remove("on");});
    selected=g.getAttribute("data-id");
    showPanel(pos[selected]);apply();
  }else{
    selected=null;groupSel=null;
    document.querySelectorAll("#rgLegend button").forEach(function(b){b.classList.remove("on");});
    panel.innerHTML='<p style="margin:0;font-size:13px;color:var(--text-secondary)">노드를 클릭하면 해당 구성요소의 설명이 여기에 표시됩니다. 범례를 누르면 그 계열만 강조됩니다.</p>';
    apply();
  }
});
var leg=document.getElementById("rgLegend");
var DOTC={teal:"#1D9E75",purple:"#7F77DD",coral:"#D85A30",red:"#E24B4A",pink:"#D4537E",gray:"#888780"};
Object.keys(GROUPS).forEach(function(k){
  var b=document.createElement("button");
  b.innerHTML='<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+DOTC[k]+';margin-right:6px"></span>'+GROUPS[k];
  b.addEventListener("click",function(){
    if(groupSel===k){groupSel=null;b.classList.remove("on");}
    else{
      groupSel=k;selected=null;
      document.querySelectorAll("#rgLegend button").forEach(function(x){x.classList.remove("on");});
      b.classList.add("on");
    }
    apply();
  });
  leg.appendChild(b);
});
})();
</script>
</body>
</html>
