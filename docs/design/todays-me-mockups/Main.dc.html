<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Jua&family=Gowun+Dodum&display=swap">
  <style>
    body { margin: 0; background: #FFD84D; font-family: 'Gowun Dodum', 'Malgun Gothic', system-ui, sans-serif; color: #141414; }
    .lex { font-family: 'Lexend', 'Malgun Gothic', system-ui, sans-serif; }
    .jua { font-family: 'Jua', 'Malgun Gothic', system-ui, sans-serif; }
    a { color: #141414; } a:hover { color: #555555; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFD84D; box-sizing: border-box;">

  <!-- decorative: olive flower bleeding off the left, small stars -->
  <svg style="position: absolute; left: -70px; top: 300px;" width="170" height="170" viewBox="0 0 100 100"><path d="M50 0C58 30 70 42 100 50 70 58 58 70 50 100 42 70 30 58 0 50 30 42 42 30 50 0Z" fill="#A9B86B"></path></svg>
  <svg style="position: absolute; right: 22px; top: 176px;" width="26" height="26" viewBox="0 0 24 24"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z" fill="#F5A7D6"></path></svg>
  <svg style="position: absolute; right: 60px; top: 214px;" width="14" height="14" viewBox="0 0 24 24"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z" fill="#141414"></path></svg>
  <div style="position: absolute; left: 236px; top: 118px; width: 10px; height: 10px; border-radius: 50%; background: #AFC9F5;"></div>
  <div style="position: absolute; left: 330px; top: 140px; width: 8px; height: 8px; border-radius: 50%; background: #141414;"></div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 16px; padding: 56px 22px 0 22px; box-sizing: border-box;">

    <!-- header -->
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #A9B86B; display: flex; align-items: center; justify-content: center;">
        <svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="#FFF3D6"></circle><circle cx="9.5" cy="12" r="1.4" fill="#141414"></circle><circle cx="16.5" cy="12" r="1.4" fill="#141414"></circle><path d="M10 16.5q3 2.4 6 0" stroke="#141414" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg>
      </div>
      <div class="lex" style="font-size: 14px; font-weight: 600; letter-spacing: 0.02em;">9월 2일 화요일</div>
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #FFF3D6; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0v5l2 3H4l2-3z"></path><path d="M10 19a2 2 0 0 0 4 0"></path></svg>
      </div>
    </div>

    <!-- headline -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div class="jua" style="font-size: 38px; line-height: 1.08; letter-spacing: -0.01em;">오늘, 하나만<br>해볼까요</div>
      <div style="font-size: 14px; color: #3A3A3A;">바쁜 날엔 하나면 충분해요</div>
    </div>

    <!-- chips -->
    <div style="display: flex; gap: 8px; align-items: center;">
      <div style="height: 44px; padding: 0 16px; border-radius: 22px; background: #141414; color: #FFFFFF; font-size: 13px; display: flex; align-items: center;">오늘의 행동</div>
      <div style="height: 44px; padding: 0 16px; border-radius: 22px; background: #FFF3D6; font-size: 13px; display: flex; align-items: center;">이번 주</div>
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #FFF3D6; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      </div>
    </div>

    <!-- card stack -->
    <div style="position: relative; height: 218px;">
      <div style="position: absolute; left: 14px; top: 0; width: 318px; height: 190px; border-radius: 28px; background: #FFF3D6; transform: rotate(-4deg);"></div>
      <div style="position: absolute; left: 30px; top: 8px; width: 318px; height: 190px; border-radius: 28px; background: #F5A7D6; transform: rotate(3deg);"></div>
      <div style="position: absolute; left: 0; top: 22px; width: 346px; height: 200px; border-radius: 28px; background: #A9B86B; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">
        <svg style="position: absolute; right: -14px; top: -18px;" width="52" height="52" viewBox="0 0 24 24"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z" fill="#FFF3D6"></path></svg>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="height: 26px; padding: 0 10px; border-radius: 13px; background: #FFF3D6; font-size: 12px; display: flex; align-items: center;">식이 기록 · 1분</div>
          <div style="height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(255,255,255,0.35); font-size: 12px; display: flex; align-items: center;">3주차</div>
        </div>
        <div class="jua" style="font-size: 27px; line-height: 1.25; color: #141414;">저녁 국물은<br>절반만 남기기</div>
        <div style="display: flex; gap: 8px;">
          <div style="height: 48px; padding: 0 20px; border-radius: 24px; background: #141414; color: #FFFFFF; font-size: 14px; display: flex; align-items: center; gap: 8px;">
            오늘 완료하기
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
          </div>
          <div style="height: 48px; padding: 0 18px; border-radius: 24px; background: #FFF3D6; font-size: 14px; display: flex; align-items: center;">못했어요</div>
        </div>
      </div>
    </div>

    <!-- track tiles -->
    <div style="display: flex; gap: 10px;">
      <!-- water: awake + checked -->
      <div style="flex: 1; height: 122px; border-radius: 24px; background: #AFC9F5; padding: 12px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; justify-content: flex-end;">
        <div style="position: absolute; right: 10px; top: 10px; width: 26px; height: 26px; border-radius: 9px; background: #141414; display: flex; align-items: center; justify-content: center;">
          <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z" fill="#FFD84D"></path></svg>
        </div>
        <svg style="position: absolute; left: 12px; top: 10px;" width="44" height="52" viewBox="0 0 60 66"><path d="M30 4C30 4 8 30 8 44a22 22 0 0 0 44 0C52 30 30 4 30 4Z" fill="#4C86F0"></path><circle cx="23" cy="42" r="2.4" fill="#141414"></circle><circle cx="37" cy="42" r="2.4" fill="#141414"></circle><path d="M25 49q5 4 10 0" stroke="#141414" stroke-width="2" fill="none" stroke-linecap="round"></path><circle cx="18" cy="48" r="3" fill="#F5A7D6" opacity="0.8"></circle><circle cx="42" cy="48" r="3" fill="#F5A7D6" opacity="0.8"></circle></svg>
        <div class="jua" style="font-size: 16px;">물</div>
        <div style="font-size: 12px; color: #2B3A5A;">4컵째 · 깨어 있음</div>
      </div>
      <!-- steps: sleeping -->
      <div style="flex: 1; height: 122px; border-radius: 24px; background: #FFF3D6; padding: 12px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; justify-content: flex-end;">
        <div style="position: absolute; right: 10px; top: 10px; width: 26px; height: 26px; border-radius: 9px; border: 2px solid #141414; box-sizing: border-box;"></div>
        <svg style="position: absolute; left: 12px; top: 8px;" width="46" height="56" viewBox="0 0 60 70"><path d="M36 4L12 40h20l-6 26 26-36H34z" fill="#FFB800"></path><path d="M30 34q4-3 8 0" stroke="#141414" stroke-width="2" fill="none" stroke-linecap="round"></path><path d="M20 34q4-3 8 0" stroke="#141414" stroke-width="2" fill="none" stroke-linecap="round"></path><text x="44" y="14" font-family="Lexend, sans-serif" font-size="11" font-weight="700" fill="#141414">z</text><text x="50" y="6" font-family="Lexend, sans-serif" font-size="8" font-weight="700" fill="#141414">z</text></svg>
        <div class="jua" style="font-size: 16px;">걸음</div>
        <div style="font-size: 12px; color: #5A4A2B;">자는 중</div>
      </div>
      <!-- mind: sleeping -->
      <div style="flex: 1; height: 122px; border-radius: 24px; background: #CDBFF7; padding: 12px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; justify-content: flex-end;">
        <div style="position: absolute; right: 10px; top: 10px; width: 26px; height: 26px; border-radius: 9px; border: 2px solid #141414; box-sizing: border-box;"></div>
        <svg style="position: absolute; left: 12px; top: 10px;" width="46" height="50" viewBox="0 0 64 64"><path d="M40 6A26 26 0 1 0 58 48 20 20 0 1 1 40 6Z" fill="#8E7BEF"></path><path d="M22 30q4-3 8 0" stroke="#141414" stroke-width="2" fill="none" stroke-linecap="round"></path><path d="M30 42q3-2 6 0" stroke="#141414" stroke-width="2" fill="none" stroke-linecap="round"></path><text x="46" y="18" font-family="Lexend, sans-serif" font-size="11" font-weight="700" fill="#141414">z</text></svg>
        <div class="jua" style="font-size: 16px;">마음</div>
        <div style="font-size: 12px; color: #3E3260;">자는 중</div>
      </div>
    </div>

    <!-- archetype teaser -->
    <div style="height: 60px; border-radius: 30px; background: #FFFFFF; padding: 8px 14px 8px 8px; box-sizing: border-box; display: flex; align-items: center; gap: 12px;">
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #141414; display: flex; align-items: center; justify-content: center;">
        <span class="lex" style="color: #FFD84D; font-size: 20px; font-weight: 800;">?</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 11px; color: #7A7A7A;">오늘의 캐릭터</div>
        <div style="font-size: 13.5px;">지금 깨어나는 중… 물방울이 반짝여요</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </div>
  </div>

  <!-- bottom nav -->
  <div style="position: absolute; left: 22px; right: 22px; bottom: 22px; height: 64px; border-radius: 32px; background: #141414; display: flex; align-items: center; justify-content: space-around; padding: 0 12px; box-sizing: border-box;">
    <div style="width: 44px; height: 44px; border-radius: 22px; background: #FFD84D; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"></path></svg>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-6M12 20V8M19 20v-10"></path></svg>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
