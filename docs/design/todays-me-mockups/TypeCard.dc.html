<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Jua&family=Gowun+Dodum&display=swap">
  <style>
    body { margin: 0; background: #BFE8CF; font-family: 'Gowun Dodum', 'Malgun Gothic', system-ui, sans-serif; color: #141414; }
    .lex { font-family: 'Lexend', 'Malgun Gothic', system-ui, sans-serif; }
    .jua { font-family: 'Jua', 'Malgun Gothic', system-ui, sans-serif; }
    a { color: #141414; } a:hover { color: #555555; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 460px; height: 460px; position: relative; overflow: hidden; background: #BFE8CF; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">

  <!-- 1:1 type card, 1080x1080 at 1/3 scale -->
  <div style="position: relative; width: 360px; height: 360px; border-radius: 28px; background: #E2593A; color: #FFF3E0; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 18px 40px rgba(20,20,20,0.16);">
    <svg style="position: absolute; right: -16px; top: -16px;" width="56" height="56" viewBox="0 0 24 24"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z" fill="#FFD84D"></path></svg>
    <div style="position: absolute; left: 26px; top: 196px; width: 7px; height: 7px; border-radius: 50%; background: #FFD84D;"></div>
    <div style="position: absolute; right: 40px; top: 250px; width: 8px; height: 8px; border-radius: 50%; background: #FFF3E0;"></div>

    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="lex" style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em;">TODAY'S ME · MY TYPE</div>
      <div class="lex" style="font-size: 11px; font-weight: 600;">09.03</div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px;">
      <div style="width: 150px; height: 150px; border-radius: 26px; overflow: hidden; background: #FFD84D; flex: none; transform: rotate(-3deg);">
        <img src="type-baby.jpg" alt="갓생 신생아 캐릭터" style="width: 100%; height: 100%; object-fit: cover; display: block;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 12px; opacity: 0.9;">나는</div>
        <div class="jua" style="font-size: 30px; line-height: 1.05; color: #FFD84D;">갓생<br>신생아</div>
        <div class="lex" style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em;">BABY GOD-SAENG</div>
      </div>
    </div>

    <div style="font-size: 13px; line-height: 1.4;">물 한 잔, 비타민 하나에도<br>뿌듯한 시작 단계</div>

    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; opacity: 0.9;">
      <div class="jua">오늘의 나</div>
      <div>갓생 신생아 타입</div>
    </div>
  </div>
