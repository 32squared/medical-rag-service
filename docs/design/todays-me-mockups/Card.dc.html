<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Jua&family=Gowun+Dodum&display=swap">
  <style>
    body { margin: 0; background: #BFE8CF; font-family: 'Gowun Dodum', 'Malgun Gothic', system-ui, sans-serif; color: #141414; }
    .lex { font-family: 'Lexend', 'Malgun Gothic', system-ui, sans-serif; }
    .jua { font-family: 'Jua', 'Malgun Gothic', system-ui, sans-serif; }
    a { color: #141414; } a:hover { color: #555555; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #BFE8CF; box-sizing: border-box;">

  <!-- decorative -->
  <svg style="position: absolute; left: -50px; top: 520px;" width="140" height="140" viewBox="0 0 100 100"><path d="M50 0C58 30 70 42 100 50 70 58 58 70 50 100 42 70 30 58 0 50 30 42 42 30 50 0Z" fill="#FFD84D"></path></svg>
  <div style="position: absolute; right: -40px; top: 150px; width: 110px; height: 110px; border-radius: 50%; background: #CDBFF7;"></div>
  <div style="position: absolute; left: 34px; top: 176px; width: 10px; height: 10px; border-radius: 50%; background: #141414;"></div>
  <div style="position: absolute; right: 70px; top: 610px; width: 8px; height: 8px; border-radius: 50%; background: #E2593A;"></div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 12px; padding: 56px 22px 0 22px; box-sizing: border-box; align-items: stretch; gap: 10px;">

    <!-- header -->
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      </div>
      <div class="jua" style="font-size: 18px;">공유 카드</div>
      <div style="width: 44px; height: 44px;"></div>
    </div>

    <!-- format chips + privacy toggle -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="height: 44px; padding: 0 14px; border-radius: 22px; background: #141414; color: #FFFFFF; font-size: 12.5px; display: flex; align-items: center;">9:16 스토리</div>
      <div style="height: 44px; padding: 0 14px; border-radius: 22px; background: #FFFFFF; font-size: 12.5px; display: flex; align-items: center;">1:1 피드</div>
      <div style="flex: 1;"></div>
      <div style="height: 44px; padding: 0 6px 0 12px; border-radius: 22px; background: #FFFFFF; font-size: 12.5px; display: flex; align-items: center; gap: 8px;">
        숫자 숨기기
        <div style="width: 34px; height: 22px; border-radius: 11px; background: #DDE6DF; position: relative;"><div style="position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF;"></div></div>
      </div>
    </div>

    <!-- the card (9:16) -->
    <div style="display: flex; justify-content: center; padding: 8px 0 2px 0;">
      <div style="position: relative; width: 254px; height: 452px; border-radius: 28px; background: #E2593A; color: #FFF3E0; padding: 20px; box-sizing: border-box; transform: rotate(-2deg); display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 18px 40px rgba(20, 20, 20, 0.16);">
        <!-- bleeding star + confetti -->
        <svg style="position: absolute; right: -18px; top: -16px;" width="58" height="58" viewBox="0 0 24 24"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z" fill="#FFD84D"></path></svg>
        <div style="position: absolute; left: 190px; top: 150px; width: 8px; height: 8px; border-radius: 50%; background: #FFF3E0;"></div>
        <div style="position: absolute; left: 30px; top: 260px; width: 7px; height: 7px; border-radius: 50%; background: #FFD84D;"></div>
        <svg style="position: absolute; left: 196px; top: 236px;" width="18" height="18" viewBox="0 0 24 24"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z" fill="#FFF3E0"></path></svg>

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div class="lex" style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em;">TODAY'S ME</div>
          <div class="lex" style="font-size: 11px; font-weight: 600;">09.02 TUE</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: baseline; gap: 6px;">
            <div class="lex" style="font-size: 58px; font-weight: 800; line-height: 0.95; letter-spacing: -0.03em;">6</div>
            <div class="jua" style="font-size: 18px;">컵의 물</div>
          </div>
          <div style="display: flex; align-items: baseline; gap: 6px;">
            <div class="lex" style="font-size: 58px; font-weight: 800; line-height: 0.95; letter-spacing: -0.03em;">6,400</div>
            <div class="jua" style="font-size: 18px;">걸음</div>
          </div>
          <div style="display: flex; align-items: baseline; gap: 6px;">
            <div class="lex" style="font-size: 58px; font-weight: 800; line-height: 0.95; letter-spacing: -0.03em;">7</div>
            <div class="jua" style="font-size: 18px;">분 마음챙김</div>
          </div>
        </div>

        <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 8px;">
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <div class="lex" style="font-size: 26px; font-weight: 800; line-height: 1; color: #FFD84D; letter-spacing: -0.02em;">Balance<br>Monk</div>
            <div style="font-size: 11px; margin-top: 4px; white-space: nowrap;">밸런스 수도승 · 이달 12%</div>
          </div>
          <svg width="84" height="84" viewBox="0 0 200 200">
            <ellipse cx="100" cy="176" rx="74" ry="16" fill="#8E7BEF"></ellipse>
            <ellipse cx="100" cy="36" rx="34" ry="8" fill="none" stroke="#FFD84D" stroke-width="6"></ellipse>
            <path d="M40 172C40 128 62 108 100 108s60 20 60 64z" fill="#A9B86B"></path>
            <path d="M100 108c-8 12-12 34-8 64h16c4-30 0-52-8-64z" fill="#FFF3D6"></path>
            <rect x="88" y="132" width="24" height="34" rx="12" fill="#FFD9B8"></rect>
            <circle cx="100" cy="82" r="46" fill="#FFD9B8"></circle>
            <path d="M74 84q9 7 18 0" stroke="#141414" stroke-width="3.2" fill="none" stroke-linecap="round"></path>
            <path d="M108 84q9 7 18 0" stroke="#141414" stroke-width="3.2" fill="none" stroke-linecap="round"></path>
            <path d="M91 102q9 7 18 0" stroke="#141414" stroke-width="3" fill="none" stroke-linecap="round"></path>
            <circle cx="68" cy="98" r="6" fill="#F5A7D6" opacity="0.85"></circle>
            <circle cx="132" cy="98" r="6" fill="#F5A7D6" opacity="0.85"></circle>
          </svg>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; opacity: 0.9;">
          <div class="jua">오늘의 나</div>
          <div>기록이 남은 하루</div>
        </div>
      </div>
    </div>

    <!-- stickers -->
    <div style="display: flex; align-items: center; gap: 6px;">
      <div style="font-size: 12px; color: #2F4A3A; margin-right: 2px;">스티커</div>
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z" fill="#FFD84D"></path></svg></div>
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="26" height="18" viewBox="0 0 80 52"><path d="M20 44a12 12 0 0 1-2-23.8A18 18 0 0 1 52 16a13 13 0 0 1 12 28z" fill="#CDBFF7"></path></svg></div>
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="16" height="20" viewBox="0 0 60 70"><path d="M36 4L12 40h20l-6 26 26-36H34z" fill="#FFB800"></path></svg></div>
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="18" height="20" viewBox="0 0 60 66"><path d="M30 4C30 4 8 30 8 44a22 22 0 0 0 44 0C52 30 30 4 30 4Z" fill="#4C86F0"></path></svg></div>
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 64 64"><path d="M40 6A26 26 0 1 0 58 48 20 20 0 1 1 40 6Z" fill="#8E7BEF"></path></svg></div>
      <div style="width: 44px; height: 44px; border-radius: 22px; border: 2px dashed #2F4A3A; box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2F4A3A" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></div>
    </div>
  </div>

  <!-- share actions -->
  <div style="position: absolute; left: 22px; right: 22px; bottom: 22px; display: flex; flex-direction: column; gap: 10px;">
    <div style="height: 58px; border-radius: 29px; background: #141414; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD84D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="#FFD84D"></circle></svg>
      <span class="jua" style="font-size: 16px;">인스타그램 스토리로 공유</span>
    </div>
    <div style="display: flex; gap: 10px;">
      <div style="flex: 1; height: 46px; border-radius: 23px; background: #FFFFFF; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4c-5 0-9 3-9 7 0 2.4 1.5 4.5 3.8 5.7L6 21l4.3-2.3c.5.1 1.1.1 1.7.1 5 0 9-3 9-7s-4-7-9-7z"></path></svg>
        카카오톡
      </div>
      <div style="flex: 1; height: 46px; border-radius: 23px; background: #FFFFFF; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"></path></svg>
        이미지 저장
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
