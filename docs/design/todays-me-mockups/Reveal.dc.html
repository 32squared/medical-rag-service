<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Jua&family=Gowun+Dodum&display=swap">
  <style>
    body { margin: 0; background: #F5A8D8; font-family: 'Gowun Dodum', 'Malgun Gothic', system-ui, sans-serif; color: #141414; }
    .lex { font-family: 'Lexend', 'Malgun Gothic', system-ui, sans-serif; }
    .jua { font-family: 'Jua', 'Malgun Gothic', system-ui, sans-serif; }
    a { color: #141414; } a:hover { color: #555555; }
    svg { display: block; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5A8D8; box-sizing: border-box;">

  <!-- decorative: olive flower off top-left, blue circle off right, confetti -->
  <svg style="position: absolute; left: -54px; top: 60px;" width="160" height="160" viewBox="0 0 100 100"><path d="M50 0C58 30 70 42 100 50 70 58 58 70 50 100 42 70 30 58 0 50 30 42 42 30 50 0Z" fill="#A9B86B"></path></svg>
  <div style="position: absolute; right: -70px; top: 330px; width: 150px; height: 150px; border-radius: 50%; background: #AFC9F5;"></div>
  <svg style="position: absolute; left: 44px; top: 428px;" width="30" height="30" viewBox="0 0 24 24"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z" fill="#FFD84D"></path></svg>
  <svg style="position: absolute; right: 54px; top: 128px;" width="20" height="20" viewBox="0 0 24 24"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z" fill="#FFFFFF"></path></svg>
  <div style="position: absolute; left: 90px; top: 112px; width: 9px; height: 9px; border-radius: 50%; background: #141414;"></div>
  <div style="position: absolute; right: 120px; top: 452px; width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF;"></div>
  <div style="position: absolute; left: 60px; top: 480px; width: 7px; height: 7px; border-radius: 50%; background: #4C86F0;"></div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 14px; padding: 56px 22px 0 22px; box-sizing: border-box;">

    <!-- header -->
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="height: 40px; padding: 0 16px; border-radius: 20px; background: #FFFFFF; font-size: 13px; display: flex; align-items: center; gap: 8px;">
        <svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z" fill="#141414"></path></svg>
        오늘의 캐릭터
      </div>
      <div style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </div>
    </div>

    <!-- stage: rotated cards + character -->
    <div style="position: relative; height: 330px;">
      <div style="position: absolute; left: 42px; top: 20px; width: 262px; height: 300px; border-radius: 32px; background: #FFF3D6; transform: rotate(6deg);"></div>
      <div style="position: absolute; left: 30px; top: 8px; width: 286px; height: 306px; border-radius: 32px; background: #FFD84D; transform: rotate(-4deg);"></div>
      <div style="position: absolute; left: 0; top: 0; width: 346px; height: 330px; display: flex; align-items: center; justify-content: center;">
        <svg width="250" height="250" viewBox="0 0 200 200">
          <!-- cushion -->
          <ellipse cx="100" cy="176" rx="74" ry="16" fill="#8E7BEF"></ellipse>
          <!-- halo -->
          <ellipse cx="100" cy="36" rx="34" ry="8" fill="none" stroke="#FFB800" stroke-width="6"></ellipse>
          <!-- body / robe -->
          <path d="M40 172C40 128 62 108 100 108s60 20 60 64z" fill="#A9B86B"></path>
          <path d="M100 108c-8 12-12 34-8 64h16c4-30 0-52-8-64z" fill="#FFF3D6"></path>
          <!-- hands (prayer) -->
          <rect x="88" y="132" width="24" height="34" rx="12" fill="#FFD9B8"></rect>
          <!-- head -->
          <circle cx="100" cy="82" r="46" fill="#FFD9B8"></circle>
          <!-- closed eyes -->
          <path d="M74 84q9 7 18 0" stroke="#141414" stroke-width="3.2" fill="none" stroke-linecap="round"></path>
          <path d="M108 84q9 7 18 0" stroke="#141414" stroke-width="3.2" fill="none" stroke-linecap="round"></path>
          <!-- smile + blush -->
          <path d="M91 102q9 7 18 0" stroke="#141414" stroke-width="3" fill="none" stroke-linecap="round"></path>
          <circle cx="68" cy="98" r="6" fill="#F5A7D6" opacity="0.85"></circle>
          <circle cx="132" cy="98" r="6" fill="#F5A7D6" opacity="0.85"></circle>
          <!-- three elements orbiting -->
          <path d="M30 60C30 60 18 74 18 82a12 12 0 0 0 24 0C42 74 30 60 30 60Z" fill="#4C86F0"></path>
          <path d="M176 48l-12 18h10l-3 14 13-18h-9z" fill="#FFB800"></path>
          <path d="M164 118a14 14 0 1 0 10 22 10 10 0 1 1-10-22z" fill="#8E7BEF"></path>
        </svg>
      </div>
    </div>

    <!-- name block -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;">
      <div class="lex" style="font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.02em;">Balance Monk</div>
      <div class="jua" style="font-size: 22px;">밸런스 수도승</div>
      <div style="font-size: 14px; color: #4A2B3E;">오늘 세 가지 모두 완료</div>
    </div>

    <!-- why tags -->
    <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
      <div style="height: 36px; padding: 0 14px; border-radius: 18px; background: #FFFFFF; font-size: 13px; display: flex; align-items: center; gap: 6px;"><div style="width: 8px; height: 8px; border-radius: 4px; background: #4C86F0;"></div>물 6컵</div>
      <div style="height: 36px; padding: 0 14px; border-radius: 18px; background: #FFFFFF; font-size: 13px; display: flex; align-items: center; gap: 6px;"><div style="width: 8px; height: 8px; border-radius: 4px; background: #FF8A5B;"></div>6,400걸음</div>
      <div style="height: 36px; padding: 0 14px; border-radius: 18px; background: #FFFFFF; font-size: 13px; display: flex; align-items: center; gap: 6px;"><div style="width: 8px; height: 8px; border-radius: 4px; background: #8E7BEF;"></div>마음챙김 7분</div>
    </div>

    <!-- rarity -->
    <div style="font-size: 13px; text-align: center; color: #4A2B3E;">이번 달 이 캐릭터 만난 사람 12%</div>

    <!-- last 7 days collection -->
    <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
      <div style="font-size: 12px; color: #4A2B3E; margin-right: 4px;">지난 7일</div>
      <div style="width: 34px; height: 34px; border-radius: 17px; background: #AFC9F5; display: flex; align-items: center; justify-content: center;"><svg width="18" height="20" viewBox="0 0 60 66"><path d="M30 4C30 4 8 30 8 44a22 22 0 0 0 44 0C52 30 30 4 30 4Z" fill="#4C86F0"></path></svg></div>
      <div style="width: 34px; height: 34px; border-radius: 17px; background: #FFD84D; display: flex; align-items: center; justify-content: center;"><svg width="16" height="20" viewBox="0 0 60 70"><path d="M36 4L12 40h20l-6 26 26-36H34z" fill="#FFB800"></path></svg></div>
      <div style="width: 34px; height: 34px; border-radius: 17px; background: #CDBFF7; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 64 64"><path d="M40 6A26 26 0 1 0 58 48 20 20 0 1 1 40 6Z" fill="#8E7BEF"></path></svg></div>
      <div style="width: 34px; height: 34px; border-radius: 17px; background: #E4EBC7; display: flex; align-items: center; justify-content: center; gap: 1px;"><svg width="11" height="13" viewBox="0 0 60 66"><path d="M30 4C30 4 8 30 8 44a22 22 0 0 0 44 0C52 30 30 4 30 4Z" fill="#4C86F0"></path></svg><svg width="11" height="11" viewBox="0 0 64 64"><path d="M40 6A26 26 0 1 0 58 48 20 20 0 1 1 40 6Z" fill="#8E7BEF"></path></svg></div>
      <div style="width: 34px; height: 34px; border-radius: 17px; background: #141414; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10 6-1 9-4 10-10z" fill="#FFD84D"></path></svg></div>
    </div>
  </div>

  <!-- actions -->
  <div style="position: absolute; left: 22px; right: 22px; bottom: 22px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <div style="width: 100%; height: 60px; border-radius: 30px; background: #141414; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; box-sizing: border-box;">
      <span class="jua" style="font-size: 17px;">카드 만들기</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFD84D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </div>
    <div style="height: 44px; font-size: 13px; color: #4A2B3E; display: flex; align-items: center;">오늘은 여기까지</div>
  </div>
</div>
</x-dc>
</body>
</html>
